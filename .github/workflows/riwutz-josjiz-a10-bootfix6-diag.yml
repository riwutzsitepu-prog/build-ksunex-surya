name: riwutz_josjiz A10 BOOTFIX7 DIAG2 4.14.355

on:
  push:
    branches: [riwutz-a10-bootfix2]
    paths:
      - '.github/workflows/riwutz-josjiz-a10-bootfix6-diag.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 unzip xz-utils zip

      - name: Checkout exact Watermelon 4.14.355 donor base
        run: |
          rm -rf kernel
          git init kernel
          git -C kernel remote add origin https://github.com/xradens/msm-4.14.git
          git -C kernel fetch --depth=1 origin 95dffb0397b21a8a54fefec47801ab460be5532f
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "95dffb0397b21a8a54fefec47801ab460be5532f"
          grep -q '^SUBLEVEL = 355$' kernel/Makefile

      - name: Apply BOOTFIX7 and diagnostic timeout
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/sched/fair.c')
          s = p.read_text()
          old = "return max(task_util(p), _task_util_est(p));\n}\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          new = "return max(task_util(p), _task_util_est(p));\n}\n\nstatic inline unsigned long boosted_task_util(struct task_struct *task);\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          if old not in s:
              raise SystemExit('boosted_task_util declaration anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('block/mq-deadline.c')
          s = p.read_text()
          bad = "static struct request *__dd_dispatch_request(struct deadline_data *dd)\n{\n\tstruct deadline_data *dd = hctx->queue->elevator->elevator_data;\n"
          good = "static struct request *__dd_dispatch_request(struct deadline_data *dd)\n{\n"
          if bad not in s:
              raise SystemExit('mq-deadline duplicate dd anchor not found')
          p.write_text(s.replace(bad, good, 1))

          p = Path('lib/lz4/lz4_decompress.c')
          s = p.read_text()
          s = s.replace('EXPORT_SYMBOL(LZ4_armv8_decompress_safe);', 'EXPORT_SYMBOL(LZ4_arm64_decompress_safe);', 1)
          s = s.replace('EXPORT_SYMBOL(LZ4_armv8_decompress_safe_partial);', 'EXPORT_SYMBOL(LZ4_arm64_decompress_safe_partial);', 1)
          p.write_text(s)

          p = Path('drivers/soc/qcom/msm_bus/msm_bus_dbg_rpmh.c')
          s = p.read_text()
          old = '#include <trace/events/trace_msm_bus.h>'
          if '#define CREATE_TRACE_POINTS' not in s:
              if old not in s:
                  raise SystemExit('msm bus trace header anchor not found')
              s = s.replace(old, '#define CREATE_TRACE_POINTS\n' + old, 1)
          p.write_text(s)

          p = Path('arch/arm64/mm/dma-mapping.c')
          s = p.read_text()
          old = '''\t\tpage = dma_alloc_from_contiguous(dev, size >> PAGE_SHIFT,\n\t\t\t\t\t\t get_order(size), flags);\n\t\tif (!page)\n\t\t\treturn NULL;\n\n\t\t*dma_handle = phys_to_dma(dev, page_to_phys(page));\n\t\taddr = page_address(page);\n\t\tmemset(addr, 0, size);\n\t} else {\n\t\taddr = swiotlb_alloc_coherent(dev, size, dma_handle, flags);\n\t}\n'''
          new = '''\t\tpage = dma_alloc_from_contiguous(dev, size >> PAGE_SHIFT,\n\t\t\t\t\t\t get_order(size), flags);\n\t\tif (page) {\n\t\t\t*dma_handle = phys_to_dma(dev, page_to_phys(page));\n\t\t\taddr = page_address(page);\n\t\t\tmemset(addr, 0, size);\n\t\t} else {\n\t\t\tpr_warn_ratelimited("riwutz: CMA coherent alloc failed for %s (%zu), fallback SWIOTLB\\n",\n\t\t\t\tdev_name(dev), size);\n\t\t\taddr = swiotlb_alloc_coherent(dev, size, dma_handle, flags);\n\t\t}\n\t} else {\n\t\taddr = swiotlb_alloc_coherent(dev, size, dma_handle, flags);\n\t}\n'''
          if old not in s:
              raise SystemExit('dma CMA fallback anchor missing')
          p.write_text(s.replace(old,new,1))

          p = Path('drivers/usb/dwc3/dwc3-msm.c')
          s = p.read_text()
          old = '''\tif (IS_ERR(mdwc->hs_phy)) {\n\t\tdev_err(&pdev->dev, "unable to get hsphy device\\n");\n\t\tret = PTR_ERR(mdwc->hs_phy);\n\t\tgoto put_dwc3;\n\t}\n'''
          new = '''\tif (IS_ERR(mdwc->hs_phy)) {\n\t\tret = PTR_ERR(mdwc->hs_phy);\n\t\tif (ret == -EPROBE_DEFER) {\n\t\t\tdev_info_ratelimited(&pdev->dev, "hsphy not ready; delaying reprobe\\n");\n\t\t\tmsleep(100);\n\t\t} else {\n\t\t\tdev_err(&pdev->dev, "unable to get hsphy device: %d\\n", ret);\n\t\t}\n\t\tgoto put_dwc3;\n\t}\n'''
          if old not in s:
              raise SystemExit('hsphy anchor missing')
          s = s.replace(old,new,1)

          old = '''\tif (IS_ERR(mdwc->ss_phy)) {\n\t\tdev_err(&pdev->dev, "unable to get ssphy device\\n");\n\t\tret = PTR_ERR(mdwc->ss_phy);\n\t\tgoto put_dwc3;\n\t}\n'''
          new = '''\tif (IS_ERR(mdwc->ss_phy)) {\n\t\tret = PTR_ERR(mdwc->ss_phy);\n\t\tif (ret == -EPROBE_DEFER) {\n\t\t\tdev_info_ratelimited(&pdev->dev, "ssphy not ready; delaying reprobe\\n");\n\t\t\tmsleep(100);\n\t\t} else {\n\t\t\tdev_err(&pdev->dev, "unable to get ssphy device: %d\\n", ret);\n\t\t}\n\t\tgoto put_dwc3;\n\t}\n'''
          if old not in s:
              raise SystemExit('ssphy anchor missing')
          p.write_text(s.replace(old,new,1))

          p = Path('init/main.c')
          s = p.read_text()
          marker = 'RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S'
          if marker in s:
              raise SystemExit('diagnostic timeout already present unexpectedly')
          s += r'''

/* RIWUTZ BOOTFIX7 diagnostic: force a warm panic after 45 seconds. */
static int riwutz_diag_timeout_thread(void *unused)
{
	pr_emerg("RIWUTZ_BOOTFIX7_DIAG: 45-second timeout armed\n");
	ssleep(45);
	panic_timeout = 5;
	panic("RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S");
	return 0;
}

static int __init riwutz_diag_timeout_init(void)
{
	struct task_struct *task;

	task = kthread_run(riwutz_diag_timeout_thread, NULL, "riwutz_diag");
	if (IS_ERR(task))
		return PTR_ERR(task);
	return 0;
}
core_initcall(riwutz_diag_timeout_init);
'''
          p.write_text(s)
          PY
          grep -n 'RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S' init/main.c
          grep -n 'fallback SWIOTLB' arch/arm64/mm/dma-mapping.c
          grep -n 'delaying reprobe' drivers/usb/dwc3/dwc3-msm.c

      - name: Prepare ClangBuiltLinux LLVM 20.1.0
        run: |
          rm -rf tc llvm-20.1.0-x86_64.tar.xz
          mkdir -p tc/llvm-20.1.0
          curl -L --fail --retry 3 https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.0-x86_64.tar.xz -o llvm-20.1.0-x86_64.tar.xz
          test "$(stat -c%s llvm-20.1.0-x86_64.tar.xz)" = "129714604"
          tar -xJf llvm-20.1.0-x86_64.tar.xz -C tc/llvm-20.1.0 --strip-components=1
          tc/llvm-20.1.0/bin/clang --version | grep -q 'clang version 20.1.0'
          echo "$GITHUB_WORKSPACE/tc/llvm-20.1.0/bin" >> "$GITHUB_PATH"

      - name: Configure BOOTFIX7 DIAG2 4.14.355
        working-directory: kernel
        run: |
          rm -rf outdiag
          make O=outdiag LLVM=1 surya_defconfig
          cat \
            "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.part00" \
            "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.part01a" \
            "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.part01b" \
            "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.part02" \
            "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.part03" \
            > ../wih-riwut-a10-delta.config
          echo '1692159dfb98bb4889e5bd9e2ffb07ee604936eeb30f37420e4cda4286d25105  ../wih-riwut-a10-delta.config' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          cfg=Path('outdiag/.config'); delta=Path('../wih-riwut-a10-delta.config')
          lines=cfg.read_text().splitlines(); pos={}
          for i,line in enumerate(lines):
              if line.startswith('CONFIG_') and '=' in line: pos[line.split('=',1)[0]]=i
              elif line.startswith('# CONFIG_') and line.endswith(' is not set'): pos[line.split()[1]]=i
          for line in delta.read_text().splitlines():
              line=line.strip()
              if not line: continue
              if line.startswith('CONFIG_') and '=' in line: key=line.split('=',1)[0]
              elif line.startswith('# CONFIG_') and line.endswith(' is not set'): key=line.split()[1]
              else: continue
              if key in pos: lines[pos[key]]=line
              else: pos[key]=len(lines); lines.append(line)
          cfg.write_text('\n'.join(lines)+'\n')
          PY

          scripts/config --file outdiag/.config --disable KSU
          scripts/config --file outdiag/.config --disable SECURITY_SMACK
          scripts/config --file outdiag/.config --disable SECURITY_SMACK_BRINGUP
          scripts/config --file outdiag/.config --disable SECURITY_SMACK_NETFILTER
          scripts/config --file outdiag/.config --disable SECURITY_SMACK_APPEND_SIGNALS
          scripts/config --file outdiag/.config --enable PSTORE
          scripts/config --file outdiag/.config --enable PSTORE_CONSOLE
          scripts/config --file outdiag/.config --enable PSTORE_PMSG
          scripts/config --file outdiag/.config --enable PSTORE_RAM
          scripts/config --file outdiag/.config --enable PSTORE_LAST_KMSG
          scripts/config --file outdiag/.config --set-str LOCALVERSION '-riwutz_josjiz'
          scripts/config --file outdiag/.config --disable LOCALVERSION_AUTO
          make O=outdiag LLVM=1 olddefconfig
          cp outdiag/.config ../bootfix7-diag.config

          grep -q '^CONFIG_PSTORE=y$' outdiag/.config
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' outdiag/.config
          grep -q '^CONFIG_PSTORE_RAM=y$' outdiag/.config
          grep -q '^CONFIG_PSTORE_LAST_KMSG=y$' outdiag/.config
          grep -q '^# CONFIG_KSU is not set$' outdiag/.config
          grep -q '^CONFIG_LOCALVERSION="-riwutz_josjiz"$' outdiag/.config

      - name: Build BOOTFIX7 DIAG2 Image
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: cahazzu
        run: |
          set -o pipefail
          make O=outdiag -j"$(nproc)" LLVM=1 Image.gz 2>&1 | tee ../bootfix7-diag-build.log
          test -s outdiag/arch/arm64/boot/Image.gz
          cp outdiag/arch/arm64/boot/Image.gz ../Image-BOOTFIX7-DIAG.gz
          gzip -dc outdiag/arch/arm64/boot/Image.gz > ../Image-BOOTFIX7-DIAG.raw
          strings ../Image-BOOTFIX7-DIAG.raw | grep -F 'Linux version 4.14.355-riwutz_josjiz' | head -n1 | tee ../bootfix7-diag-version.txt
          strings ../Image-BOOTFIX7-DIAG.raw | grep -F 'RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S' | head -n1 | tee ../bootfix7-diag-marker.txt
          strings ../Image-BOOTFIX7-DIAG.raw | grep -F 'fallback SWIOTLB' | head -n1 | tee ../bootfix7-diag-usbmarker.txt
          ! strings ../Image-BOOTFIX7-DIAG.raw | grep -q 'KernelSU:'
          rm -f ../Image-BOOTFIX7-DIAG.raw
          sha256sum ../Image-BOOTFIX7-DIAG.gz | tee ../Image-BOOTFIX7-DIAG.gz.sha256

      - name: Upload BOOTFIX7 DIAG2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz-BOOTFIX7-DIAG2-A10
          if-no-files-found: warn
          retention-days: 30
          path: |
            Image-BOOTFIX7-DIAG.gz
            Image-BOOTFIX7-DIAG.gz.sha256
            bootfix7-diag.config
            bootfix7-diag-build.log
            bootfix7-diag-version.txt
            bootfix7-diag-marker.txt
            bootfix7-diag-usbmarker.txt
