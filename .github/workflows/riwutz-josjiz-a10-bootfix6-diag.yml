name: riwutz_josjiz A10 BOOTFIX9 UFS ICE 4.14.355

on:
  push:
    branches: [riwutz-a10-bootfix2]
    paths:
      - '.github/workflows/riwutz-josjiz-a10-bootfix6-diag.yml'
      - '.github/scripts/bootfix9_core_compat.py'
      - '.github/scripts/bootfix7_diag_config.py'
      - '.github/scripts/bootfix8_qusb_legacy.py'
      - '.github/scripts/bootfix9_ufs_a10_compat.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 unzip xz-utils zip

      - name: Checkout exact Watermelon 4.14.355
        run: |
          rm -rf kernel
          git init kernel
          git -C kernel remote add origin https://github.com/xradens/msm-4.14.git
          git -C kernel fetch --depth=1 origin 95dffb0397b21a8a54fefec47801ab460be5532f
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "95dffb0397b21a8a54fefec47801ab460be5532f"
          grep -q '^SUBLEVEL = 355$' kernel/Makefile

      - name: Apply BOOTFIX9 compatibility set
        run: |
          python3 .github/scripts/bootfix9_core_compat.py kernel
          python3 .github/scripts/bootfix8_qusb_legacy.py kernel
          python3 .github/scripts/bootfix9_ufs_a10_compat.py kernel
          grep -q 'RIWUTZ_BOOTFIX8_QUSB_LEGACY10' kernel/drivers/usb/phy/phy-msm-qusb-v2.c
          grep -q 'RIWUTZ_BOOTFIX9_UFS_A10_PHANDLE' kernel/drivers/scsi/ufs/ufshcd-crypto-qti.c
          ! grep -q 'RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S' kernel/init/main.c
          ! grep -q 'fallback SWIOTLB' kernel/arch/arm64/mm/dma-mapping.c
          ! grep -q 'hsphy not ready; delaying reprobe' kernel/drivers/usb/dwc3/dwc3-msm.c

      - name: Prepare ClangBuiltLinux 20.1.0
        run: |
          rm -rf tc llvm-20.1.0-x86_64.tar.xz
          mkdir -p tc/llvm-20.1.0
          curl -L --fail --retry 3 https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.0-x86_64.tar.xz -o llvm-20.1.0-x86_64.tar.xz
          test "$(stat -c%s llvm-20.1.0-x86_64.tar.xz)" = "129714604"
          tar -xJf llvm-20.1.0-x86_64.tar.xz -C tc/llvm-20.1.0 --strip-components=1
          tc/llvm-20.1.0/bin/clang --version | grep -q 'clang version 20.1.0'
          echo "$GITHUB_WORKSPACE/tc/llvm-20.1.0/bin" >> "$GITHUB_PATH"

      - name: Configure BOOTFIX9
        run: |
          rm -rf kernel/outdiag
          make -C kernel O=outdiag LLVM=1 surya_defconfig
          python3 .github/scripts/bootfix7_diag_config.py "$GITHUB_WORKSPACE" kernel
          kernel/scripts/config --file kernel/outdiag/.config --disable KSU
          kernel/scripts/config --file kernel/outdiag/.config --disable SECURITY_SMACK
          kernel/scripts/config --file kernel/outdiag/.config --disable SECURITY_SMACK_BRINGUP
          kernel/scripts/config --file kernel/outdiag/.config --disable SECURITY_SMACK_NETFILTER
          kernel/scripts/config --file kernel/outdiag/.config --disable SECURITY_SMACK_APPEND_SIGNALS
          kernel/scripts/config --file kernel/outdiag/.config --enable PSTORE
          kernel/scripts/config --file kernel/outdiag/.config --enable PSTORE_CONSOLE
          kernel/scripts/config --file kernel/outdiag/.config --enable PSTORE_PMSG
          kernel/scripts/config --file kernel/outdiag/.config --enable PSTORE_RAM
          kernel/scripts/config --file kernel/outdiag/.config --enable PSTORE_LAST_KMSG
          kernel/scripts/config --file kernel/outdiag/.config --set-str LOCALVERSION '-riwutz_josjiz'
          kernel/scripts/config --file kernel/outdiag/.config --disable LOCALVERSION_AUTO
          make -C kernel O=outdiag LLVM=1 olddefconfig
          cp kernel/outdiag/.config bootfix9.config
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' kernel/outdiag/.config
          grep -q '^CONFIG_PSTORE_RAM=y$' kernel/outdiag/.config
          grep -q '^# CONFIG_KSU is not set$' kernel/outdiag/.config
          grep -q '^CONFIG_LOCALVERSION="-riwutz_josjiz"$' kernel/outdiag/.config

      - name: Build BOOTFIX9 Image
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: cahazzu
        run: |
          set -o pipefail
          make -C kernel O=outdiag -j"$(nproc)" LLVM=1 Image.gz 2>&1 | tee bootfix9-build.log
          test -s kernel/outdiag/arch/arm64/boot/Image.gz
          cp kernel/outdiag/arch/arm64/boot/Image.gz Image-BOOTFIX9.gz
          gzip -dc Image-BOOTFIX9.gz > Image-BOOTFIX9.raw
          strings Image-BOOTFIX9.raw | grep -F 'Linux version 4.14.355-riwutz_josjiz' | head -n1 | tee bootfix9-version.txt
          strings Image-BOOTFIX9.raw | grep -F 'RIWUTZ_BOOTFIX8_QUSB_LEGACY10' | head -n1 | tee bootfix9-qusb-marker.txt
          strings Image-BOOTFIX9.raw | grep -F 'RIWUTZ_BOOTFIX9_UFS_A10_PHANDLE' | head -n1 | tee bootfix9-ufs-marker.txt
          ! strings Image-BOOTFIX9.raw | grep -q 'fallback SWIOTLB'
          ! strings Image-BOOTFIX9.raw | grep -q 'RIWUTZ_BOOTFIX7_DIAG_TIMEOUT_45S'
          ! strings Image-BOOTFIX9.raw | grep -q 'KernelSU:'
          rm -f Image-BOOTFIX9.raw
          sha256sum Image-BOOTFIX9.gz | tee Image-BOOTFIX9.gz.sha256

      - name: Upload BOOTFIX9 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz-BOOTFIX9-A10-UFS-ICE
          retention-days: 30
          path: |
            Image-BOOTFIX9.gz
            Image-BOOTFIX9.gz.sha256
            bootfix9.config
            bootfix9-build.log
            bootfix9-version.txt
            bootfix9-qusb-marker.txt
            bootfix9-ufs-marker.txt
