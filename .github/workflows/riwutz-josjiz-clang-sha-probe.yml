name: riwutz_josjiz clang SHA probe

on:
  push:
    paths:
      - '.github/workflows/riwutz-josjiz-clang-sha-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and print exact SHA256
        run: |
          set -euxo pipefail
          URL='https://github.com/greenforce-project/greenforce_clang/releases/download/24072024/greenforce-clang-20.0.0git-24072024.tar.zst'
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/clang.tar.zst "$URL"
          sha256sum /tmp/clang.tar.zst
          ls -lh /tmp/clang.tar.zst
