name: CahAzzu A10 4.14.190 Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cahazzu-a10-414190-clean.yml"
      - "scripts/cahazzu_manual_hooks.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: https://github.com/stormbreaker-project/kernel_xiaomi_surya.git
      KERNEL_COMMIT: 4738039b3cafe1ab9afa85d726049247f7939580
      DEFCONFIG_BLOB: eac02495481ef52df965e2f02e96417a4a55951e
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_COMMIT: 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553
      KSU_TAG: v1.1.1
      TC_REPO: https://github.com/kdrag0n/proton-clang.git
      TC_COMMIT: 08a35cd973e866932ca1b7f3e573293e0829c129
      EXPECTED_LLVM_COMMIT: 9829f5e6b1bca9b61efc629770d28bb9014dec45
      EXPECTED_DTB_SHA256: 8eb391b228f59ffc98885fcb2101cc2f49965de3e7e4aba5ba864158e43b31e1
      DONOR_B64_SHA256: 6c7b01b3379bb1bf86e0652986ba41dfdbf85e2d959e812e4898f4cff445c9ae
      DONOR_B64_SIZE: "167296"
      DONOR_XZ_SHA256: edf5031085d2ba244f92b809cb231f702e2a64db1d4ef88f40fab907bf521200
      DONOR_XZ_SIZE: "125472"
      DONOR_TAIL_SIZE: "2092004"

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Checkout exact QASSA DTB payload
        uses: actions/checkout@v4
        with:
          repository: riwutzsitepu-prog/trial-kernel
          ref: aa24e82bacd6ccaf9bca7937a7e2ad99867ab5ad
          path: donor_repo

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            make python3 python-is-python3 rsync unzip xz-utils zip zstd

      - name: Fetch StormBreaker 4.14.190
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -Fx 'VERSION = 4' Makefile
          grep -Fx 'PATCHLEVEL = 14' Makefile
          grep -Fx 'SUBLEVEL = 190' Makefile
          test -f arch/arm64/configs/vendor/surya-stock_defconfig
          test "$(git hash-object arch/arm64/configs/vendor/surya-stock_defconfig)" = "$DEFCONFIG_BLOB"

      - name: Fetch exact Proton Clang
        run: |
          set -euxo pipefail
          git init proton-clang
          cd proton-clang
          git remote add origin "$TC_REPO"
          git fetch --depth=1 origin "$TC_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TC_COMMIT"
          test -x bin/clang
          ./bin/clang --version | tee "$GITHUB_WORKSPACE/compiler.txt"
          grep -q "$EXPECTED_LLVM_COMMIT" "$GITHUB_WORKSPACE/compiler.txt"

      - name: Integrate KernelSU Next v1.1.1 manual-only
        working-directory: kernel
        run: |
          set -euxo pipefail
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "$KSU_TAG"

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-y += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p = Path("KernelSU-Next/kernel/Makefile")
          s = p.read_text()
          s = s.replace("obj-$(CONFIG_KSU) += kernelsu.o", "obj-y += kernelsu.o")
          s = s.replace("ccflags-y += -DKSU_UMOUNT\n", "")
          start = s.find('ifneq ($(shell grep -Eq "^static int can_umount"')
          end = s.find('ifneq ($(shell grep -q "atomic_t filter_count;"')
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          elif start >= 0:
              raise SystemExit("cannot isolate KSU_UMOUNT compatibility block")
          p.write_text(s)
          PY

          grep -Fx 'obj-y += kernelsu.o' KernelSU-Next/kernel/Makefile
          ! grep -q 'ccflags-y += -DKSU_UMOUNT' KernelSU-Next/kernel/Makefile

          # StormBreaker 4.14.190 backports post-flex-array SELinux policydb.
          # Teach KSU v1.1.1 to use its direct-array path without changing kernel SELinux.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("KernelSU-Next/kernel/selinux/sepolicy.c")
          s = p.read_text()
          marker = '#define KSU_SUPPORT_ADD_TYPE'
          compat = '''#ifdef KSU_SELINUX_DIRECT_ARRAY_BACKPORT
          #define type_val_to_struct type_val_to_struct_array
          #endif

          #define KSU_SUPPORT_ADD_TYPE'''
          if 'KSU_SELINUX_DIRECT_ARRAY_BACKPORT\n#define type_val_to_struct' not in s:
              if marker not in s:
                  raise SystemExit("KSU sepolicy marker not found")
              s = s.replace(marker, compat, 1)
          old = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)'
          new = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0) || defined(KSU_SELINUX_DIRECT_ARRAY_BACKPORT)'
          if s.count(old) != 2:
              raise SystemExit(f"unexpected KSU direct-array guard count: {s.count(old)}")
          s = s.replace(old, new)
          p.write_text(s)

          m = Path("KernelSU-Next/kernel/Makefile")
          ms = m.read_text()
          flag = 'ccflags-y += -DKSU_SELINUX_DIRECT_ARRAY_BACKPORT'
          if flag not in ms:
              ms += '\n' + flag + '\n'
              m.write_text(ms)
          PY
          grep -Fq 'defined(KSU_SELINUX_DIRECT_ARRAY_BACKPORT)' KernelSU-Next/kernel/selinux/sepolicy.c
          grep -Fq '#define type_val_to_struct type_val_to_struct_array' KernelSU-Next/kernel/selinux/sepolicy.c
          grep -Fx 'ccflags-y += -DKSU_SELINUX_DIRECT_ARRAY_BACKPORT' KernelSU-Next/kernel/Makefile

      - name: Apply donor-safe manual hooks
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/cahazzu_manual_hooks.py"
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_execveat_ksud' fs/exec.c
          grep -q 'ksu_handle_prctl' security/security.c

      - name: Configure CahAzzu
        working-directory: kernel
        run: |
          set -euxo pipefail
          cp arch/arm64/configs/vendor/surya-stock_defconfig .config
          test "$(git hash-object .config)" = "$DEFCONFIG_BLOB"

          scripts/config --file .config --keep-case -e TOUCHSCREEN_NT36xxx_HOSTDL_SPI
          scripts/config --file .config -e AW8624_HAPTIC
          scripts/config --file .config -e DRV2624_HAPTIC
          scripts/config --file .config -e CRYPTO_DEV_QCOM_ICE
          scripts/config --file .config -d KPROBES
          scripts/config --file .config -e OVERLAY_FS

          # Android/QASSA uses SELinux. SMACK is incompatible with this source's embedded sk_security.
          scripts/config --file .config -d SECURITY_SMACK
          scripts/config --file .config -d SECURITY_SMACK_BRINGUP
          scripts/config --file .config -d SECURITY_SMACK_NETFILTER
          scripts/config --file .config -d SECURITY_SMACK_APPEND_SIGNALS

          scripts/config --file .config --set-str LOCALVERSION "-CahAzzu"
          scripts/config --file .config -d LOCALVERSION_AUTO

          # Preserve QASSA CPU topology values required by this 4.14.190 Kconfig.
          scripts/config --file .config --set-val LITTLE_CPU_MASK 63
          scripts/config --file .config --set-val BIG_CPU_MASK 192

          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make ARCH=arm64 olddefconfig

          grep -Fx 'CONFIG_LITTLE_CPU_MASK=63' .config
          grep -Fx 'CONFIG_BIG_CPU_MASK=192' .config
          grep -Fx 'CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=y' .config
          grep -Fx 'CONFIG_AW8624_HAPTIC=y' .config
          grep -Fx 'CONFIG_DRV2624_HAPTIC=y' .config
          grep -Fx 'CONFIG_CRYPTO_DEV_QCOM_ICE=y' .config
          grep -Fx 'CONFIG_SCSI_UFS_CRYPTO=y' .config
          grep -Fx 'CONFIG_SCSI_UFS_CRYPTO_QTI=y' .config
          grep -Fx '# CONFIG_KPROBES is not set' .config
          grep -Fx 'CONFIG_SECURITY_SELINUX=y' .config
          grep -Fx '# CONFIG_SECURITY_SMACK is not set' .config
          grep -Fx 'CONFIG_DEFAULT_SECURITY_SELINUX=y' .config
          grep -Fx 'CONFIG_DEFAULT_SECURITY="selinux"' .config
          grep -Fx 'CONFIG_OVERLAY_FS=y' .config
          grep -Fx 'CONFIG_LOCALVERSION="-CahAzzu"' .config
          grep -Fx '# CONFIG_LOCALVERSION_AUTO is not set' .config
          cp .config "$GITHUB_WORKSPACE/CahAzzu.config"

      - name: Patch 4.14.190 scheduler watchdog declaration
        working-directory: kernel
        run: |
          set -euxo pipefail
          grep -Fq 'touch_nmi_watchdog();' kernel/sched/debug.c
          if ! grep -Fq '#include <linux/nmi.h>' kernel/sched/debug.c; then
            sed -i '/#include <linux\/debugfs.h>/a #include <linux/nmi.h>' kernel/sched/debug.c
          fi
          grep -Fn '#include <linux/nmi.h>' kernel/sched/debug.c

          # First actual Run #10 compile blocker: legacy HID trace include path.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/hid/hid-trace.h")
          s = p.read_text()
          old = "#define TRACE_INCLUDE_PATH ."
          new = "#define TRACE_INCLUDE_PATH ../../drivers/hid"
          if new not in s:
              if old not in s:
                  raise SystemExit("HID trace include anchor not found")
              p.write_text(s.replace(old, new, 1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/hid' drivers/hid/hid-trace.h

          # First actual Run #14 compile blocker: Qualcomm camera trace header path.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/media/platform/msm/camera/cam_utils/cam_trace.h")
          s = p.read_text()
          old = "#define TRACE_INCLUDE_PATH ."
          new = "#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils"
          if new not in s:
              if old not in s:
                  raise SystemExit("camera trace include anchor not found")
              p.write_text(s.replace(old, new, 1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils' drivers/media/platform/msm/camera/cam_utils/cam_trace.h

          # First actual Run #15 compile blocker: totalram_pages is a function in this 4.14.190 tree.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/staging/android/lowmemorykiller.c")
          s = p.read_text()
          old = "mult_frac(100, nr_usable, totalram_pages)"
          new = "mult_frac(100, nr_usable, totalram_pages())"
          if new not in s:
              if old not in s:
                  raise SystemExit("LMK totalram_pages anchor not found")
              p.write_text(s.replace(old, new, 1))
          PY
          grep -Fn 'mult_frac(100, nr_usable, totalram_pages())' drivers/staging/android/lowmemorykiller.c

          # First actual Run #15 compile blocker: totalram_pages is a function on this 4.14.190 tree.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/staging/android/lowmemorykiller.c")
          s = p.read_text()
          old = "mult_frac(100, nr_usable, totalram_pages)"
          new = "mult_frac(100, nr_usable, totalram_pages())"
          if new not in s:
              if old not in s:
                  raise SystemExit("lowmemorykiller totalram_pages anchor not found")
              p.write_text(s.replace(old, new, 1))
          PY
          grep -Fn 'mult_frac(100, nr_usable, totalram_pages())' drivers/staging/android/lowmemorykiller.c

      - name: Build CahAzzu
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=CahAzzu
          export KBUILD_BUILD_HOST=CahAzzu
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS='-DCONFIG_KSU'

          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS='-DCONFIG_KSU' \
            Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test -s arch/arm64/boot/Image.gz
          gzip -t arch/arm64/boot/Image.gz

      - name: Stage native 4.14.190 kernel image
        run: |
          set -euxo pipefail
          cp kernel/arch/arm64/boot/Image.gz Image.gz
          test -s Image.gz
          gzip -t Image.gz

          # This source/defconfig explicitly uses a non-appended DTB kernel.
          grep -Fx '# CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set' CahAzzu.config
          grep -Fx '# CONFIG_BUILD_ARM64_DT_OVERLAY is not set' CahAzzu.config

      - name: Validate kernel
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          raw = gzip.decompress(Path("Image.gz").read_bytes())
          Path("CahAzzu-Image").write_bytes(raw)
          PY

          strings CahAzzu-Image | grep -m1 '^Linux version ' | tee kernel-version.txt
          strings CahAzzu-Image | grep -q '4.14.190-CahAzzu'
          strings CahAzzu-Image | grep -q '/data/adb/ksud'
          strings CahAzzu-Image | grep -q '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7'

          KSU_KERNEL_VERSION="$(grep -oE 'KernelSU-Next version: [0-9]+' build.log | tail -n1 | awk '{print $3}')"
          test -n "$KSU_KERNEL_VERSION"
          test "$KSU_KERNEL_VERSION" -ge 12797
          echo "KernelSU Next kernel-side version: $KSU_KERNEL_VERSION" | tee ksu-kernel-version.txt

          sha256sum Image.gz | tee compiled-hashes.txt

      - name: Package CahAzzu
        run: |
          set -euxo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout --detach e4b1bb25ca2aabcfd57f694a5998d87130701b71
          rm -rf ak3/.git ak3/.github
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb ak3/dtb.img ak3/dtbo.img
          cp Image.gz ak3/Image.gz
          cp kernel-version.txt ak3/kernel-version.txt
          cp ksu-kernel-version.txt ak3/ksu-kernel-version.txt

          cat > ak3/anykernel.sh <<'AK3'
          ### AnyKernel3
          properties() { '
          kernel.string=CahAzzu
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print "CahAzzu";
          ui_print "Linux 4.14.190";
          ui_print "KernelSU Next v1.1.1";
          ui_print "Manual hooks / KPROBES OFF / NOUMOUNT";
          ui_print "Native 4.14.190 Image.gz; ROM DTB/DTBO untouched";

          dump_boot;
          write_boot;
          AK3
          sed -i 's/^[[:space:]]\{10\}//' ak3/anykernel.sh
          chmod 755 ak3/anykernel.sh

          cat > ak3/CahAzzu-INFO.txt <<EOF
          CahAzzu
          Device: Poco X3 NFC surya/karna
          Android: 10
          Linux: 4.14.190
          Source: $KERNEL_COMMIT
          KernelSU Next: v1.1.1
          Hook mode: manual
          KPROBES: off
          KSU_UMOUNT: off
          Touchscreen: NT36xxx donor option restored
          Haptics: AW8624 + DRV2624 donor options restored
          DTB: preserved from installed ROM boot image
          DTBO: untouched
          EOF

          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/CahAzzu.zip" . -x '*.git*' 'README.md' '*placeholder' >/dev/null)
          unzip -tq CahAzzu.zip
          unzip -l CahAzzu.zip | grep -E '(^| )Image.gz          if unzip -l CahAzzu.zip | grep -Eq 'Image.gz-dtb|(^|/)dtb(\.img)?$|dtbo.img'; then
            echo "DTB/DTBO must remain untouched"
            exit 1
          fi
          sha256sum CahAzzu.zip | tee CahAzzu.zip.sha256

      - name: Upload final CahAzzu
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu
          path: |
            CahAzzu.zip
            CahAzzu.zip.sha256
            kernel-version.txt
            ksu-kernel-version.txt
            compiled-hashes.txt
            CahAzzu.config
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-failure
          path: |
            build.log
            compiler.txt
            CahAzzu.config
          if-no-files-found: ignore

          if unzip -l CahAzzu.zip | grep -q 'dtbo.img'; then
            echo "DTBO must remain untouched"
            exit 1
          fi
          sha256sum CahAzzu.zip | tee CahAzzu.zip.sha256

      - name: Upload final CahAzzu
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu
          path: |
            CahAzzu.zip
            CahAzzu.zip.sha256
            kernel-version.txt
            ksu-kernel-version.txt
            compiled-hashes.txt
            CahAzzu.config
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-failure
          path: |
            build.log
            compiler.txt
            CahAzzu.config
          if-no-files-found: ignore
