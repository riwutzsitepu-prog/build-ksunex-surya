name: Rethinking A10 QNATIVE4 V7 CLEAN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rethinking-a10-qnative4-v7-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: https://github.com/Cilok-LAB/android_kernel_xiaomi_surya.git
      KERNEL_COMMIT: e5a52193a1015217595bee0ac70711077d824069
      DONOR_REPO: https://github.com/stormbreaker-project/kernel_xiaomi_surya.git
      DONOR_COMMIT: b2268fb331c144580e5be88d8d5d6f91ac8182b3
      DONOR_DEFCONFIG_BLOB: 1aab348ac65154d4ae1b17c09bfa639b1e3fc13e
      DTB_REPO: riwutzsitepu-prog/trial-kernel
      DTB_REF: aa24e82bacd6ccaf9bca7937a7e2ad99867ab5ad
      DONOR_B64_SHA256: 6c7b01b3379bb1bf86e0652986ba41dfdbf85e2d959e812e4898f4cff445c9ae
      DONOR_XZ_SHA256: edf5031085d2ba244f92b809cb231f702e2a64db1d4ef88f40fab907bf521200
      DONOR_DTB_SHA256: 8eb391b228f59ffc98885fcb2101cc2f49965de3e7e4aba5ba864158e43b31e1
      DONOR_DTB_SIZE: '2092004'
      CLANG_URL: https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz
      OFFICIAL_ZIP_URL: https://github.com/Cilok-LAB/android_kernel_xiaomi_surya/releases/download/202604212227/rethinking-SnowCone-KSU-202604212227.zip
      OFFICIAL_ZIP_SHA256: 4ab84eb1508f60917249ed5192b06b3238e8a795dd868ffba3943a993f19a55d
      ZIP_NAME: Rethinking-4.14.357-KSU-Surya-A10-QNATIVE4-V7-CLEAN.zip
      TAG_NAME: rethinking-a10-qnative4-v7-clean

    steps:
      - name: Checkout exact donor DTB payload
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DTB_REPO }}
          ref: ${{ env.DTB_REF }}
          path: donor_payload

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential cpio curl file flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev make python3 unzip wget xz-utils zip

      - name: Clone kernel and donor
        run: |
          set -euxo pipefail
          git init kernel
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -q '^SUBLEVEL = 357$' kernel/Makefile

          git init donor_kernel
          git -C donor_kernel remote add origin "$DONOR_REPO"
          git -C donor_kernel fetch --depth=1 origin "$DONOR_COMMIT"
          git -C donor_kernel checkout --detach FETCH_HEAD
          test "$(git -C donor_kernel hash-object arch/arm64/configs/Surya-stock_defconfig)" = "$DONOR_DEFCONFIG_BLOB"
          cp donor_kernel/arch/arm64/configs/Surya-stock_defconfig donor.config

      - name: Patch 4.14.357 donor-config compatibility
        run: |
          set -euxo pipefail
          cd kernel

          python3 -c 'from pathlib import Path; p=Path("kernel/cgroup/cpuset.c"); s=p.read_text(); nl=chr(10); a=s.index("static ssize_t cpuset_write_resmask_assist("); b=s.index("static ssize_t cpuset_write_resmask_wrapper",a); blk=s[a:b]; p.write_text(s[:a]+"#ifdef CONFIG_CPUSET_ASSIST"+nl+blk+"#endif"+nl+nl+s[b:])'

          python3 -c 'from pathlib import Path; p=Path("block/mq-deadline.c"); s=p.read_text(); bad="struct deadline_data *dd = hctx->queue->elevator->elevator_data;"; assert bad in s; p.write_text(s.replace(bad,"",1))'

          python3 -c 'from pathlib import Path; p=Path("kernel/sched/tune.c"); s=p.read_text(); nl=chr(10); old=".write_s64 = boost_write_wrapper,"; assert old in s; new="#ifdef CONFIG_STUNE_ASSIST"+nl+"                .write_s64 = boost_write_wrapper,"+nl+"#else"+nl+"                .write_s64 = boost_write,"+nl+"#endif"; s=s.replace(old,new,1); old=".write_u64 = prefer_idle_write_wrapper,"; assert old in s; new="#ifdef CONFIG_STUNE_ASSIST"+nl+"                .write_u64 = prefer_idle_write_wrapper,"+nl+"#else"+nl+"                .write_u64 = prefer_idle_write,"+nl+"#endif"; p.write_text(s.replace(old,new,1))'

          sed -n '1775,1815p' kernel/cgroup/cpuset.c
          sed -n '194,206p' block/mq-deadline.c
          sed -n '716,746p' kernel/sched/tune.c

      - name: Prepare Clang 21
        run: |
          set -euxo pipefail
          mkdir clang
          wget -q "$CLANG_URL" -O clang.tar.xz
          tar -xf clang.tar.xz -C clang
          if compgen -G 'clang/clang-*' > /dev/null; then mv clang/clang-*/* clang/; fi
          test -x clang/bin/clang
          clang/bin/clang --version | head -n3 | tee compiler.txt

      - name: Configure Android 10 donor baseline
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          cp "$GITHUB_WORKSPACE/donor.config" out/.config
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config --set-str LOCALVERSION "-rethinking-Q10-N4V7"
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config -d BUILD_ARM64_DT_OVERLAY
          scripts/config --file out/.config -e BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --file out/.config -d CAMERA_BOOTCLOCK_TIMESTAMP
          scripts/config --file out/.config --set-val LITTLE_CPU_MASK 63
          scripts/config --file out/.config --set-val BIG_CPU_MASK 192
          scripts/config --file out/.config -d SECURITY_SMACK
          scripts/config --file out/.config -d SECURITY_SMACK_BRINGUP
          scripts/config --file out/.config -d SECURITY_SMACK_NETFILTER
          scripts/config --file out/.config -d SECURITY_SMACK_APPEND_SIGNALS
          scripts/config --file out/.config -d CPUSET_ASSIST

          # Use the native 4.14.357 ZRAM backend; its LZO-RLE backend is incomplete.
          scripts/config --file out/.config -e ZRAM_BACKEND_LZ4
          scripts/config --file out/.config -d ZRAM_BACKEND_LZ4HC
          scripts/config --file out/.config -d ZRAM_BACKEND_ZSTD
          scripts/config --file out/.config -d ZRAM_BACKEND_DEFLATE
          scripts/config --file out/.config -d ZRAM_BACKEND_842
          scripts/config --file out/.config -d ZRAM_BACKEND_LZO
          scripts/config --file out/.config -e ZRAM_DEF_COMP_LZ4

          make O=out ARCH=arm64 olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_LITTLE_CPU_MASK=63$' out/.config
          grep -q '^CONFIG_BIG_CPU_MASK=192$' out/.config
          grep -q '^# CONFIG_SECURITY_SMACK is not set$' out/.config
          grep -q '^# CONFIG_CPUSET_ASSIST is not set
          for k in CONFIG_SCHED_WALT CONFIG_RT_GROUP_SCHED CONFIG_SCHED_CORE_CTL CONFIG_ARCH_SM6150 CONFIG_ARCH_SDMMAGPIE CONFIG_PCI_MSM CONFIG_PINCTRL_SM6150 CONFIG_QCOM_WATCHDOG_V2 CONFIG_MSM_GCC_SM6150 CONFIG_MSM_GPUCC_SM6150 CONFIG_MSM_VIDEOCC_SM6150 CONFIG_MSM_CAMCC_SM6150 CONFIG_MSM_DISPCC_SM6150 CONFIG_QCOM_SM6150_LLCC CONFIG_QTI_PDC_SM6150 CONFIG_EXT4_ENCRYPTION CONFIG_F2FS_FS_ENCRYPTION; do
            grep -q "^$k=y$" out/.config || { echo "MISSING=$k"; exit 1; }
          done
          cp out/.config "$GITHUB_WORKSPACE/final.config"

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=khayloaf
          export KBUILD_BUILD_HOST=builder
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test -s out/arch/arm64/boot/Image.gz
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/Image.gz"
          strings out/arch/arm64/boot/Image | grep -m1 '^Linux version ' | tee "$GITHUB_WORKSPACE/kernel-version.txt"

      - name: Restore exact 12-DTB tail
        run: |
          set -euxo pipefail
          mkdir exact
          cat donor_payload/staging_exact_final/part* > exact/tail.xz.b64
          echo "$DONOR_B64_SHA256  exact/tail.xz.b64" | sha256sum -c -
          base64 -d exact/tail.xz.b64 > exact/tail.xz
          echo "$DONOR_XZ_SHA256  exact/tail.xz" | sha256sum -c -
          xz -dc exact/tail.xz > exact/tail.bin
          test "$(stat -c %s exact/tail.bin)" = "$DONOR_DTB_SIZE"
          echo "$DONOR_DTB_SHA256  exact/tail.bin" | sha256sum -c -
          python3 donor_payload/verify_test4_donor.py exact/tail.bin --report FDT_VALIDATION.txt

      - name: Assemble and validate
        run: |
          set -euxo pipefail
          cat Image.gz exact/tail.bin > Image.gz-dtb
          python3 -c 'import zlib,hashlib,os; from pathlib import Path; d=zlib.decompressobj(16+zlib.MAX_WBITS); x=Path("Image.gz-dtb").read_bytes(); raw=d.decompress(x)+d.flush(); tail=d.unused_data; assert len(tail)==int(os.environ["DONOR_DTB_SIZE"]); assert hashlib.sha256(tail).hexdigest()==os.environ["DONOR_DTB_SHA256"]; Path("Image.raw").write_bytes(raw)'
          strings Image.raw | grep -m1 '^Linux version ' | tee assembled-kernel-version.txt
          sha256sum Image.gz Image.gz-dtb exact/tail.bin | tee compiled-hashes.txt

      - name: Package
        run: |
          set -euxo pipefail
          wget -q "$OFFICIAL_ZIP_URL" -O official.zip
          echo "$OFFICIAL_ZIP_SHA256  official.zip" | sha256sum -c -
          unzip -q official.zip -d ak3
          rm -f ak3/kernels/Image ak3/kernels/Image.gz ak3/kernels/dtb.img ak3/kernels/dtbo.img ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb.img ak3/dtbo.img
          cp Image.gz-dtb ak3/Image.gz-dtb
          cp FDT_VALIDATION.txt ak3/FDT_VALIDATION.txt
          cat > ak3/anykernel.sh <<'AK3'
          # AnyKernel3
          properties() { '
          kernel.string=Rethinking 4.14.357 QNATIVE4-V7 KSU | Surya Android 10
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }
          block="/dev/block/bootdevice/by-name/boot";
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          ui_print "Rethinking 4.14.357 QNATIVE4-V7";
          ui_print "Donor A10 config + exact QASSA 12-DTB";
          dump_boot;
          write_boot;
          AK3
          chmod 755 ak3/anykernel.sh
          chmod 755 ak3/META-INF/com/google/android/update-binary || true
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' 'README.md' '*placeholder')
          unzip -tq "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | grep -q 'META-INF/com/google/android/update-binary'
          unzip -l "$ZIP_NAME" | grep -q 'Image.gz-dtb'
          ! unzip -l "$ZIP_NAME" | grep -E '(^|/)dtbo\.img$'
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qnative4-v7-clean
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            assembled-kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            final.config
            build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Rethinking 4.14.357 QNATIVE4-V7 Surya A10
          prerelease: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            final.config
          fail_on_unmatched_files: true
 out/.config
          grep -q '^CONFIG_ZRAM_BACKEND_LZ4=y
          for k in CONFIG_SCHED_WALT CONFIG_RT_GROUP_SCHED CONFIG_SCHED_CORE_CTL CONFIG_ARCH_SM6150 CONFIG_ARCH_SDMMAGPIE CONFIG_PCI_MSM CONFIG_PINCTRL_SM6150 CONFIG_QCOM_WATCHDOG_V2 CONFIG_MSM_GCC_SM6150 CONFIG_MSM_GPUCC_SM6150 CONFIG_MSM_VIDEOCC_SM6150 CONFIG_MSM_CAMCC_SM6150 CONFIG_MSM_DISPCC_SM6150 CONFIG_QCOM_SM6150_LLCC CONFIG_QTI_PDC_SM6150 CONFIG_EXT4_ENCRYPTION CONFIG_F2FS_FS_ENCRYPTION; do
