name: Rethinking 4.14.357 A10 QNATIVE4 V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rethinking-a10-qnative4-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/Cilok-LAB/android_kernel_xiaomi_surya.git
      KERNEL_COMMIT: e5a52193a1015217595bee0ac70711077d824069
      DONOR_KERNEL_REPO: https://github.com/stormbreaker-project/kernel_xiaomi_surya.git
      DONOR_KERNEL_COMMIT: b2268fb331c144580e5be88d8d5d6f91ac8182b3
      DONOR_DEFCONFIG_BLOB: 1aab348ac65154d4ae1b17c09bfa639b1e3fc13e
      DTB_REPO: riwutzsitepu-prog/trial-kernel
      DTB_REF: aa24e82bacd6ccaf9bca7937a7e2ad99867ab5ad
      DONOR_B64_SHA256: 6c7b01b3379bb1bf86e0652986ba41dfdbf85e2d959e812e4898f4cff445c9ae
      DONOR_B64_SIZE: '167296'
      DONOR_XZ_SHA256: edf5031085d2ba244f92b809cb231f702e2a64db1d4ef88f40fab907bf521200
      DONOR_XZ_SIZE: '125472'
      DONOR_DTB_SHA256: 8eb391b228f59ffc98885fcb2101cc2f49965de3e7e4aba5ba864158e43b31e1
      DONOR_DTB_SIZE: '2092004'
      CLANG_URL: https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz
      OFFICIAL_ZIP_URL: https://github.com/Cilok-LAB/android_kernel_xiaomi_surya/releases/download/202604212227/rethinking-SnowCone-KSU-202604212227.zip
      OFFICIAL_ZIP_SHA256: 4ab84eb1508f60917249ed5192b06b3238e8a795dd868ffba3943a993f19a55d
      ZIP_NAME: Rethinking-4.14.357-KSU-Surya-A10-QNATIVE4-V3-DONORCONFIG-EXACTDTB.zip
      TAG_NAME: rethinking-a10-qnative4-v3-donorconfig-exactdtb

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout exact donor DTB payload
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DTB_REPO }}
          ref: ${{ env.DTB_REF }}
          path: donor_payload

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ca-certificates cpio curl file flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev make python3 python-is-python3 rsync unzip wget xz-utils zip zstd

      - name: Clone Rethinking 4.14.357
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -q '^SUBLEVEL = 357$' Makefile
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/source-sha.txt"

      - name: Patch CPUSET_ASSIST off compile guard
        run: |
          set -euxo pipefail
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          p=Path("kernel/cgroup/cpuset.c")
          s=p.read_text()
          old='''static ssize_t cpuset_write_resmask_assist(struct kernfs_open_file *of,
                                           struct cs_target tgt, size_t nbytes,
                                           loff_t off)
{
        pr_info("cpuset_assist: setting %s to %s\\n", tgt.name, tgt.cpus);
        return cpuset_write_resmask(of, tgt.cpus, nbytes, off);
}
'''
          if old not in s:
              raise SystemExit("cpuset assist helper anchor not found")
          new='''#ifdef CONFIG_CPUSET_ASSIST
''' + old + '''#endif
'''
          p.write_text(s.replace(old,new,1))
          PY
          grep -n -A8 -B2 'cpuset_write_resmask_assist' kernel/cgroup/cpuset.c | head -n20

      - name: Fetch donor Android 10 defconfig
        run: |
          set -euxo pipefail
          git init donor_kernel
          cd donor_kernel
          git remote add origin "$DONOR_KERNEL_REPO"
          git fetch --depth=1 origin "$DONOR_KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test -f arch/arm64/configs/Surya-stock_defconfig
          test "$(git hash-object arch/arm64/configs/Surya-stock_defconfig)" = "$DONOR_DEFCONFIG_BLOB"
          cp arch/arm64/configs/Surya-stock_defconfig "$GITHUB_WORKSPACE/Surya-stock_defconfig.exact"

      - name: Prepare Clang 21
        run: |
          set -euxo pipefail
          mkdir -p clang
          wget -q --show-progress "$CLANG_URL" -O clang.tar.xz
          tar -xf clang.tar.xz -C clang
          if compgen -G 'clang/clang-*' > /dev/null; then mv clang/clang-*/* clang/; fi
          test -x clang/bin/clang
          clang/bin/clang --version | head -n3 | tee compiler.txt

      - name: Configure donor-based Android 10 kernel
        run: |
          set -euxo pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/Surya-stock_defconfig.exact" out/.config

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config --set-str LOCALVERSION "-rethinking-Q10-N4V3"
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config -d BUILD_ARM64_DT_OVERLAY
          scripts/config --file out/.config -e BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --file out/.config -d CAMERA_BOOTCLOCK_TIMESTAMP

          # New-source compatibility only; donor platform configuration remains intact.
          scripts/config --file out/.config --set-val LITTLE_CPU_MASK 63
          scripts/config --file out/.config --set-val BIG_CPU_MASK 192
          scripts/config --file out/.config -d SECURITY_SMACK
          scripts/config --file out/.config -d SECURITY_SMACK_BRINGUP
          scripts/config --file out/.config -d SECURITY_SMACK_NETFILTER
          scripts/config --file out/.config -d SECURITY_SMACK_APPEND_SIGNALS
          scripts/config --file out/.config -d CPUSET_ASSIST

          make O=out ARCH=arm64 olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_LOCALVERSION="-rethinking-Q10-N4V3"$' out/.config
          grep -q '^CONFIG_LITTLE_CPU_MASK=63$' out/.config
          grep -q '^CONFIG_BIG_CPU_MASK=192$' out/.config
          grep -q '^# CONFIG_SECURITY_SMACK is not set$' out/.config
          grep -q '^# CONFIG_CPUSET_ASSIST is not set$' out/.config
          grep -q '^# CONFIG_BUILD_ARM64_DT_OVERLAY is not set$' out/.config

          for k in CONFIG_SCHED_WALT CONFIG_RT_GROUP_SCHED CONFIG_SCHED_CORE_CTL CONFIG_ARCH_SM6150 CONFIG_ARCH_SDMMAGPIE CONFIG_PCI_MSM CONFIG_PINCTRL_SM6150 CONFIG_QCOM_WATCHDOG_V2 CONFIG_MSM_GCC_SM6150 CONFIG_MSM_GPUCC_SM6150 CONFIG_MSM_VIDEOCC_SM6150 CONFIG_MSM_CAMCC_SM6150 CONFIG_MSM_DISPCC_SM6150 CONFIG_QCOM_SM6150_LLCC CONFIG_QTI_PDC_SM6150 CONFIG_EXT4_ENCRYPTION CONFIG_F2FS_FS_ENCRYPTION; do
            grep -q "^$k=y$" out/.config || { echo "MISSING_CRITICAL=$k"; exit 1; }
          done

          cp out/.config "$GITHUB_WORKSPACE/rethinking-qnative4-v3.config"
          grep -E '^(CONFIG_SCHED_WALT|CONFIG_RT_GROUP_SCHED|CONFIG_SCHED_CORE_CTL|CONFIG_ARCH_SM6150|CONFIG_ARCH_SDMMAGPIE|CONFIG_PCI_MSM|CONFIG_PINCTRL_SM6150|CONFIG_QCOM_WATCHDOG_V2|CONFIG_MSM_.*SM6150|CONFIG_QCOM_SM6150_LLCC|CONFIG_QTI_PDC_SM6150|CONFIG_EXT4_ENCRYPTION|CONFIG_F2FS_FS_ENCRYPTION|CONFIG_LITTLE_CPU_MASK|CONFIG_BIG_CPU_MASK)=' out/.config | tee "$GITHUB_WORKSPACE/qnative4-v3-critical.config"

      - name: Build Image.gz
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=khayloaf
          export KBUILD_BUILD_HOST=builder
          make -j"$(nproc --all)" O=out ARCH=arm64             CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm             OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip             CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             LLVM=1 LLVM_IAS=1 Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/Image.gz"
          strings out/arch/arm64/boot/Image | grep -m1 '^Linux version ' | tee "$GITHUB_WORKSPACE/kernel-version.txt"
          strings out/arch/arm64/boot/Image | grep -q '^Linux version 4\.14\.357-rethinking-Q10-N4V3'

      - name: Reconstruct exact donor 12-DTB
        run: |
          set -euxo pipefail
          PART_DIR=donor_payload/staging_exact_final
          mkdir -p exact_dtb
          cat "$PART_DIR"/part* > exact_dtb/tail.xz.b64
          test "$(stat -c %s exact_dtb/tail.xz.b64)" = "$DONOR_B64_SIZE"
          echo "$DONOR_B64_SHA256  exact_dtb/tail.xz.b64" | sha256sum -c -
          base64 -d exact_dtb/tail.xz.b64 > exact_dtb/tail.xz
          test "$(stat -c %s exact_dtb/tail.xz)" = "$DONOR_XZ_SIZE"
          echo "$DONOR_XZ_SHA256  exact_dtb/tail.xz" | sha256sum -c -
          xz -dc exact_dtb/tail.xz > exact_dtb/tail.bin
          test "$(stat -c %s exact_dtb/tail.bin)" = "$DONOR_DTB_SIZE"
          echo "$DONOR_DTB_SHA256  exact_dtb/tail.bin" | sha256sum -c -
          python3 donor_payload/verify_test4_donor.py exact_dtb/tail.bin --out-dir exact_dtb/fdts --report FDT_VALIDATION.txt
          grep -q '^FDT_VALIDATION=PASS$' FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' FDT_VALIDATION.txt

      - name: Assemble Image.gz-dtb
        run: |
          set -euxo pipefail
          cat Image.gz exact_dtb/tail.bin > Image.gz-dtb
          python3 - <<'PY'
          import hashlib, os, zlib
          from pathlib import Path
          data=Path('Image.gz-dtb').read_bytes()
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          raw=d.decompress(data)+d.flush()
          tail=d.unused_data
          assert len(tail)==int(os.environ['DONOR_DTB_SIZE'])
          assert hashlib.sha256(tail).hexdigest()==os.environ['DONOR_DTB_SHA256']
          Path('Image.raw').write_bytes(raw)
          PY
          strings Image.raw | grep -m1 '^Linux version ' | tee assembled-kernel-version.txt
          sha256sum Image.gz Image.gz-dtb exact_dtb/tail.bin | tee compiled-hashes.txt

      - name: Fetch AnyKernel base
        run: |
          set -euxo pipefail
          wget -q --show-progress "$OFFICIAL_ZIP_URL" -O official.zip
          echo "$OFFICIAL_ZIP_SHA256  official.zip" | sha256sum -c -
          unzip -tq official.zip

      - name: Package flashable
        run: |
          set -euxo pipefail
          rm -rf ak3
          unzip -q official.zip -d ak3
          rm -f ak3/kernels/Image ak3/kernels/Image.gz ak3/kernels/dtb.img ak3/kernels/dtbo.img
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb.img ak3/dtbo.img
          cp Image.gz-dtb ak3/Image.gz-dtb
          cp FDT_VALIDATION.txt ak3/FDT_VALIDATION.txt
          cp kernel-version.txt ak3/kernel-version.txt
          cp qnative4-v3-critical.config ak3/QNATIVE4-V3-CRITICAL-CONFIG.txt

          cat > ak3/anykernel.sh <<'AK3'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Rethinking 4.14.357 QNATIVE4-V3 KSU | Surya Android 10
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }

          block="/dev/block/bootdevice/by-name/boot";
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          ui_print "Rethinking 4.14.357 QNATIVE4-V3 KSU";
          ui_print "Donor Android 10 platform config";
          ui_print "Exact QASSA 12-DTB byte-for-byte";
          ui_print "DTBO untouched";

          dump_boot;
          write_boot;
          AK3

          chmod 755 ak3/anykernel.sh
          chmod 755 ak3/META-INF/com/google/android/update-binary || true

          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' 'README.md' '*placeholder')
          unzip -tq "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | grep -q 'META-INF/com/google/android/update-binary'
          unzip -l "$ZIP_NAME" | grep -q 'Image.gz-dtb'
          ! unzip -l "$ZIP_NAME" | grep -E '(^|/)dtbo\.img$'
          ! unzip -l "$ZIP_NAME" | grep -E '(^|/)dtb\.img$'
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rethinking-a10-qnative4-v3
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            assembled-kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            rethinking-qnative4-v3.config
            qnative4-v3-critical.config
            compiler.txt
            source-sha.txt
            build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Rethinking 4.14.357 KSU Surya A10 QNATIVE4-V3
          prerelease: true
          body: |
            Rethinking 4.14.357 rebuilt from the exact Android 10 donor Surya-stock config.
            New-source-only compatibility: CPU topology masks seeded from native Rethinking config, SMACK disabled, CPUSET_ASSIST disabled.
            Exact original QASSA 12-DTB tail is reused byte-for-byte. DTBO untouched.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            rethinking-qnative4-v3.config
            qnative4-v3-critical.config
          fail_on_unmatched_files: true
