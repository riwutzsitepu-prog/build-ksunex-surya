name: MODE_CLONING DONOR REPRO 12701

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mode-cloning-donor-repro-12701.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/stormbreaker-project/kernel_xiaomi_surya.git
      KERNEL_COMMIT: b2268fb331c144580e5be88d8d5d6f91ac8182b3
      EXPECTED_DEFCONFIG_BLOB: 1aab348ac65154d4ae1b17c09bfa639b1e3fc13e
      EXPECTED_DTB_SHA256: 8eb391b228f59ffc98885fcb2101cc2f49965de3e7e4aba5ba864158e43b31e1
      DONOR_B64_SHA256: 6c7b01b3379bb1bf86e0652986ba41dfdbf85e2d959e812e4898f4cff445c9ae
      DONOR_B64_SIZE: '167296'
      DONOR_XZ_SHA256: edf5031085d2ba244f92b809cb231f702e2a64db1d4ef88f40fab907bf521200
      DONOR_XZ_SIZE: '125472'
      DONOR_TAIL_SIZE: '2092004'
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_COMMIT: 9d9f9ed5d5f3a66a2f44e24c926075554f9275ce
      KSU_TAG: v1.0.8
      TC_REPO: https://github.com/kdrag0n/proton-clang.git
      TC_COMMIT: 08a35cd973e866932ca1b7f3e573293e0829c129
      EXPECTED_LLVM_COMMIT: 9829f5e6b1bca9b61efc629770d28bb9014dec45
      ZIP_NAME: MODE_CLONING-SURYA-A10-DONOR-REPRO-KSU12701.zip
      TAG_NAME: mode-cloning-surya-a10-donor-repro-ksu12701

    steps:
      - name: Checkout exact donor DTB payload
        uses: actions/checkout@v4
        with:
          repository: riwutzsitepu-prog/trial-kernel
          ref: aa24e82bacd6ccaf9bca7937a7e2ad99867ab5ad
          path: donor_repo

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            make python3 python-is-python3 rsync unzip xz-utils zip zstd

      - name: Clone donor-era StormBreaker 4.14.117 source
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 117$' Makefile
          test -f arch/arm64/configs/Surya-stock_defconfig
          ACTUAL_BLOB="$(git hash-object arch/arm64/configs/Surya-stock_defconfig)"
          echo "defconfig blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_DEFCONFIG_BLOB"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/kernel-source-sha.txt"

      - name: Prepare exact donor Proton Clang 13
        run: |
          set -euxo pipefail
          git init proton-clang
          cd proton-clang
          git remote add origin "$TC_REPO"
          git fetch --depth=1 origin "$TC_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TC_COMMIT"
          test -x bin/clang
          ./bin/clang --version | head -n3 | tee "$GITHUB_WORKSPACE/compiler.txt"
          grep -q "$EXPECTED_LLVM_COMMIT" "$GITHUB_WORKSPACE/compiler.txt"

      - name: Integrate donor-era KernelSU Next v1.0.8 as manual-only
        run: |
          set -euxo pipefail
          cd kernel
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "$KSU_TAG"

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-y += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p = Path("KernelSU-Next/kernel/Makefile")
          s = p.read_text()
          s = s.replace("obj-$(CONFIG_KSU) += kernelsu.o", "obj-y += kernelsu.o")

          start = s.find("REPO_OWNER := KernelSU-Next")
          end_marker = "ccflags-y += -DKSU_VERSION=$(KSU_VERSION)"
          end = s.find(end_marker)
          if start < 0 or end < 0:
              raise SystemExit("cannot locate v1.0.8 version block")
          end += len(end_marker)
          forced = """KSU_VERSION := 12701
          $(info -- KernelSU-Next version: $(KSU_VERSION))
          ccflags-y += -DKSU_VERSION=$(KSU_VERSION)"""
          s = s[:start] + forced + s[end:]

          s = s.replace("ccflags-y += -DKSU_UMOUNT\n", "")
          um_start = s.find('ifneq ($(shell grep -Eq "^static int can_umount"')
          warn = s.find("ccflags-y += -Wno-implicit-function-declaration")
          if um_start < 0 or warn <= um_start:
              raise SystemExit("cannot locate v1.0.8 umount compatibility block")
          s = s[:um_start] + s[warn:]
          p.write_text(s)
          PY

          grep -q '^obj-y += kernelsu.o$' KernelSU-Next/kernel/Makefile
          grep -q '^KSU_VERSION := 12701$' KernelSU-Next/kernel/Makefile
          ! grep -q 'ccflags-y += -DKSU_UMOUNT' KernelSU-Next/kernel/Makefile
          git -C KernelSU-Next rev-parse HEAD | tee "$GITHUB_WORKSPACE/ksunext-source-sha.txt"

      - name: Apply donor-style manual KernelSU hooks
        run: |
          set -euxo pipefail
          cd kernel
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, desc):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"{desc}: anchor not found in {path}")
              p.write_text(s.replace(old, new, 1))

          p = Path("security/security.c")
          s = p.read_text()
          decl_anchor = "/* Security operations */"
          decl = """#ifdef CONFIG_KSU
          extern int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3,
          		     unsigned long arg4, unsigned long arg5);
          extern int ksu_handle_rename(struct dentry *old_dentry, struct dentry *new_dentry);
          extern int ksu_handle_setuid(struct cred *new, const struct cred *old);
          #endif

          /* Security operations */"""
          if "extern int ksu_handle_prctl" not in s:
              if decl_anchor not in s:
                  raise SystemExit("security declarations anchor not found")
              s = s.replace(decl_anchor, decl, 1)

          old = """int security_inode_rename(struct inode *old_dir, struct dentry *old_dentry,
          			   struct inode *new_dir, struct dentry *new_dentry,
          			   unsigned int flags)
          {"""
          new = old + """
          #ifdef CONFIG_KSU
          	ksu_handle_rename(old_dentry, new_dentry);
          #endif"""
          if "ksu_handle_rename(old_dentry, new_dentry);" not in s:
              if old not in s:
                  raise SystemExit("security rename anchor not found")
              s = s.replace(old, new, 1)

          old = """int security_task_fix_setuid(struct cred *new, const struct cred *old,
          			     int flags)
          {"""
          new = old + """
          #ifdef CONFIG_KSU
          	ksu_handle_setuid(new, old);
          #endif"""
          if "ksu_handle_setuid(new, old);" not in s:
              if old not in s:
                  raise SystemExit("security setuid anchor not found")
              s = s.replace(old, new, 1)

          old = """int security_task_prctl(int option, unsigned long arg2, unsigned long arg3,
          			 unsigned long arg4, unsigned long arg5)
          {"""
          new = old + """
          #ifdef CONFIG_KSU
          	ksu_handle_prctl(option, arg2, arg3, arg4, arg5);
          #endif"""
          if "ksu_handle_prctl(option, arg2, arg3, arg4, arg5);" not in s:
              if old not in s:
                  raise SystemExit("security prctl anchor not found")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("fs/exec.c")
          s = p.read_text()
          anchor = """static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {"""
          repl = """#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat_ksud(int *fd, struct filename **filename_ptr,
          				     struct user_arg_ptr *argv,
          				     struct user_arg_ptr *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          					 void *argv, void *envp, int *flags);
          #endif

          static int do_execveat_common(int fd, struct filename *filename,
          			      struct user_arg_ptr argv,
          			      struct user_arg_ptr envp,
          			      int flags)
          {
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_execveat_hook))
          		ksu_handle_execveat_ksud(&fd, &filename, &argv, &envp, &flags);
          	else
          		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif"""
          if "ksu_handle_execveat_ksud(&fd" not in s:
              if anchor not in s:
                  raise SystemExit("exec hook anchor not found")
              s = s.replace(anchor, repl, 1)
              p.write_text(s)

          once("fs/open.c",
          """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {""",
          """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          				int *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif""", "faccessat hook")

          once("fs/read_write.c",
          """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {""",
          """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,
          			       size_t *count_ptr);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_sys_read(fd, &buf, &count);
          #endif""", "read hook")

          once("fs/stat.c",
          """SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {""",
          """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif

          SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif""", "stat hook")

          once("drivers/input/input.c",
          """static void input_handle_event(struct input_dev *dev,
          			       unsigned int type, unsigned int code, int value)
          {""",
          """#ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type,
          					unsigned int *code, int *value);
          #endif

          static void input_handle_event(struct input_dev *dev,
          			       unsigned int type, unsigned int code, int value)
          {
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_input_hook))
          		ksu_handle_input_handle_event(&type, &code, &value);
          #endif""", "input hook")

          once("drivers/tty/pty.c",
          """static struct tty_struct *pts_unix98_lookup(struct tty_driver *driver,
          		struct file *file, int idx)
          {
          	struct tty_struct *tty;

          	mutex_lock(&devpts_mutex);""",
          """#ifdef CONFIG_KSU
          extern int ksu_handle_devpts(struct inode *inode);
          #endif

          static struct tty_struct *pts_unix98_lookup(struct tty_driver *driver,
          		struct file *file, int idx)
          {
          	struct tty_struct *tty;

          #ifdef CONFIG_KSU
          	ksu_handle_devpts(file->f_path.dentry->d_inode);
          #endif

          	mutex_lock(&devpts_mutex);""", "devpts hook")
          PY

          grep -q 'ksu_handle_prctl' security/security.c
          grep -q 'ksu_handle_rename(old_dentry, new_dentry)' security/security.c
          grep -q 'ksu_handle_setuid(new, old)' security/security.c
          grep -q 'ksu_handle_execveat_ksud' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_devpts' drivers/tty/pty.c

      - name: Configure exact donor defconfig
        run: |
          set -euxo pipefail
          cd kernel
          cp arch/arm64/configs/Surya-stock_defconfig .config

          # Preserve and verify the original donor defconfig byte-for-byte.
          test "$(git hash-object .config)" = "$EXPECTED_DEFCONFIG_BLOB"
          cp .config "$GITHUB_WORKSPACE/DONOR-REPRO.base.config"

          grep -q '^CONFIG_LOCALVERSION="-perf"$' .config
          grep -q '^CONFIG_LOCALVERSION_AUTO=y$' .config
          grep -q '^# CONFIG_KPROBES is not set$' .config
          grep -q '^CONFIG_OVERLAY_FS=y$' .config
          ! grep -q '^CONFIG_KSU' .config
          ! grep -q '^CONFIG_LITTLE_CPU_MASK' .config
          ! grep -q '^CONFIG_BIG_CPU_MASK' .config

          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"

          # Public source exposes CPU mask prompts absent from the exact donor
          # defconfig. Feed Kconfig defaults non-interactively without adding
          # LITTLE_CPU_MASK/BIG_CPU_MASK assignments to the workflow.
          yes "" | make ARCH=arm64 oldconfig

          grep -q '^# CONFIG_CPUSET_ASSIST is not set
          cp .config "$GITHUB_WORKSPACE/DONOR-REPRO.config"

      - name: Build donor reproduction Image.gz
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=DESKTOP-MD9IT2D
          export KBUILD_BUILD_VERSION=5
          export KBUILD_BUILD_TIMESTAMP='Thu Aug 13 21:42:36 WIB 2026'
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS='-DCONFIG_KSU'

          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS='-DCONFIG_KSU' \
            Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Assemble exact donor 12-DTB tail
        run: |
          set -euxo pipefail
          PART_DIR=donor_repo/staging_exact_final
          mkdir -p donor_exact
          B64=donor_exact/qassa_donor_12dtb.tail.xz.b64
          XZ=donor_exact/qassa_donor_12dtb.tail.xz
          TAIL=donor_exact/qassa_donor_12dtb.tail

          test "$(find "$PART_DIR" -maxdepth 1 -type f -name 'part*' | wc -l)" = "30"
          cat "$PART_DIR"/part* > "$B64"
          test "$(stat -c %s "$B64")" = "$DONOR_B64_SIZE"
          echo "$DONOR_B64_SHA256  $B64" | sha256sum -c -
          base64 -d "$B64" > "$XZ"
          test "$(stat -c %s "$XZ")" = "$DONOR_XZ_SIZE"
          echo "$DONOR_XZ_SHA256  $XZ" | sha256sum -c -
          xz -dc "$XZ" > "$TAIL"
          test "$(stat -c %s "$TAIL")" = "$DONOR_TAIL_SIZE"
          echo "$EXPECTED_DTB_SHA256  $TAIL" | sha256sum -c -

          python3 donor_repo/verify_test4_donor.py "$TAIL" \
            --out-dir donor_exact/fdts \
            --report donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_VALIDATION=PASS$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_LEFTOVER_BYTES=0$' donor_exact/FDT_VALIDATION.txt

          IMG_GZ=kernel/arch/arm64/boot/Image.gz
          IMG=kernel/arch/arm64/boot/Image.gz-dtb
          test -s "$IMG_GZ"
          gzip -t "$IMG_GZ"
          cat "$IMG_GZ" "$TAIL" > "$IMG"

      - name: Validate donor reproduction
        run: |
          set -euxo pipefail
          IMG=kernel/arch/arm64/boot/Image.gz-dtb

          python3 - <<'PY'
          import hashlib, os, zlib
          from pathlib import Path
          img = Path("kernel/arch/arm64/boot/Image.gz-dtb").read_bytes()
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = d.decompress(img) + d.flush()
          tail = d.unused_data
          Path("DONOR-REPRO-Image").write_bytes(raw)
          Path("DONOR-REPRO-dtb-tail.img").write_bytes(tail)
          if len(tail) != int(os.environ["DONOR_TAIL_SIZE"]):
              raise SystemExit("DTB tail size mismatch")
          if hashlib.sha256(tail).hexdigest() != os.environ["EXPECTED_DTB_SHA256"]:
              raise SystemExit("DTB tail hash mismatch")
          PY

          strings DONOR-REPRO-Image | grep -m1 '^Linux version ' | tee kernel-version.txt
          strings DONOR-REPRO-Image | grep -q '/data/adb/ksud'
          strings DONOR-REPRO-Image | grep -q '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7'
          grep -q -- '-- KernelSU-Next version: 12701' build.log
          echo 'KernelSU Next kernel-side version: 12701' | tee ksu-kernel-version.txt
          grep -q '^FDT_VALIDATION=PASS$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' donor_exact/FDT_VALIDATION.txt

          cp donor_exact/FDT_VALIDATION.txt FDT_VALIDATION.txt
          sha256sum "$IMG" DONOR-REPRO-dtb-tail.img | tee compiled-hashes.txt

      - name: Package with donor boot-safe AnyKernel behavior
        run: |
          set -euxo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout --detach e4b1bb25ca2aabcfd57f694a5998d87130701b71
          rm -rf ak3/.git ak3/.github
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb.img ak3/dtbo.img
          cp kernel/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cp FDT_VALIDATION.txt ak3/FDT_VALIDATION.txt

          cat > ak3/anykernel.sh <<'AK3'
          ### AnyKernel3
          properties() { '
          kernel.string=MODE_CLONING DONOR REPRO | KSU 12701 | BOOT BASELINE
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print "MODE_CLONING DONOR REPRO";
          ui_print "Poco X3 NFC surya/karna - Android 10";
          ui_print "KSU Next kernel-side 12701";
          ui_print "Manual-only hooks / no LSM / KPROBES OFF";
          ui_print "NOUMOUNT";
          ui_print "Exact QASSA 12-DTB donor tail";
          ui_print "DTBO untouched";

          dump_boot;
          write_boot;
          AK3
          chmod 755 ak3/anykernel.sh

          cat > ak3/DONOR-REPRO-INFO.txt <<EOF
          Purpose: reproduce the known-booting donor before any KSU upgrade.
          Source: $KERNEL_COMMIT
          Defconfig blob: $EXPECTED_DEFCONFIG_BLOB
          KSU Next: v1.0.8 / 12701
          KSU commit: $KSU_COMMIT
          Toolchain commit: $TC_COMMIT
          Expected LLVM commit: $EXPECTED_LLVM_COMMIT
          KSU mode: manual-only; CONFIG_KSU supplied via KCFLAGS
          LSM KSU hooks: disabled
          KPROBES: disabled by donor config
          KSU_UMOUNT: disabled
          DTB SHA256: $EXPECTED_DTB_SHA256
          DTBO: untouched
          Installer: donor boot-safe behavior
          EOF

          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' 'README.md' '*placeholder')
          unzip -tq "$ZIP_NAME"
          if unzip -l "$ZIP_NAME" | grep -q 'dtbo.img'; then
            echo "ERROR: DTBO must remain untouched"
            exit 1
          fi
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Publish donor reproduction release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: MODE_CLONING Surya A10 Donor Reproduction KSU12701
          prerelease: true
          body: |
            Diagnostic donor-reproduction baseline for Poco X3 NFC surya/karna Android 10.
            Goal: reproduce the known-booting QASSA donor before attempting any KSU upgrade.
            Source: donor-era StormBreaker 4.14.117 commit.
            KSU Next v1.0.8 / kernel-side 12701, manual-only integration, no KSU LSM hooks, KPROBES disabled, NOUMOUNT.
            Exact donor defconfig, exact donor-era Proton Clang, exact QASSA 12-DTB tail, donor-style AnyKernel installer, DTBO untouched.
            This is a runtime TEST baseline, not yet declared boot-stable.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            ksu-kernel-version.txt
            compiler.txt
          fail_on_unmatched_files: true
 .config
          cp .config "$GITHUB_WORKSPACE/DONOR-REPRO.config"

      - name: Build donor reproduction Image.gz
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=root
          export KBUILD_BUILD_HOST=DESKTOP-MD9IT2D
          export KBUILD_BUILD_VERSION=5
          export KBUILD_BUILD_TIMESTAMP='Thu Aug 13 21:42:36 WIB 2026'
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS='-DCONFIG_KSU'

          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS='-DCONFIG_KSU' \
            Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Assemble exact donor 12-DTB tail
        run: |
          set -euxo pipefail
          PART_DIR=donor_repo/staging_exact_final
          mkdir -p donor_exact
          B64=donor_exact/qassa_donor_12dtb.tail.xz.b64
          XZ=donor_exact/qassa_donor_12dtb.tail.xz
          TAIL=donor_exact/qassa_donor_12dtb.tail

          test "$(find "$PART_DIR" -maxdepth 1 -type f -name 'part*' | wc -l)" = "30"
          cat "$PART_DIR"/part* > "$B64"
          test "$(stat -c %s "$B64")" = "$DONOR_B64_SIZE"
          echo "$DONOR_B64_SHA256  $B64" | sha256sum -c -
          base64 -d "$B64" > "$XZ"
          test "$(stat -c %s "$XZ")" = "$DONOR_XZ_SIZE"
          echo "$DONOR_XZ_SHA256  $XZ" | sha256sum -c -
          xz -dc "$XZ" > "$TAIL"
          test "$(stat -c %s "$TAIL")" = "$DONOR_TAIL_SIZE"
          echo "$EXPECTED_DTB_SHA256  $TAIL" | sha256sum -c -

          python3 donor_repo/verify_test4_donor.py "$TAIL" \
            --out-dir donor_exact/fdts \
            --report donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_VALIDATION=PASS$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_LEFTOVER_BYTES=0$' donor_exact/FDT_VALIDATION.txt

          IMG_GZ=kernel/arch/arm64/boot/Image.gz
          IMG=kernel/arch/arm64/boot/Image.gz-dtb
          test -s "$IMG_GZ"
          gzip -t "$IMG_GZ"
          cat "$IMG_GZ" "$TAIL" > "$IMG"

      - name: Validate donor reproduction
        run: |
          set -euxo pipefail
          IMG=kernel/arch/arm64/boot/Image.gz-dtb

          python3 - <<'PY'
          import hashlib, os, zlib
          from pathlib import Path
          img = Path("kernel/arch/arm64/boot/Image.gz-dtb").read_bytes()
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = d.decompress(img) + d.flush()
          tail = d.unused_data
          Path("DONOR-REPRO-Image").write_bytes(raw)
          Path("DONOR-REPRO-dtb-tail.img").write_bytes(tail)
          if len(tail) != int(os.environ["DONOR_TAIL_SIZE"]):
              raise SystemExit("DTB tail size mismatch")
          if hashlib.sha256(tail).hexdigest() != os.environ["EXPECTED_DTB_SHA256"]:
              raise SystemExit("DTB tail hash mismatch")
          PY

          strings DONOR-REPRO-Image | grep -m1 '^Linux version ' | tee kernel-version.txt
          strings DONOR-REPRO-Image | grep -q '/data/adb/ksud'
          strings DONOR-REPRO-Image | grep -q '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7'
          grep -q -- '-- KernelSU-Next version: 12701' build.log
          echo 'KernelSU Next kernel-side version: 12701' | tee ksu-kernel-version.txt
          grep -q '^FDT_VALIDATION=PASS$' donor_exact/FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' donor_exact/FDT_VALIDATION.txt

          cp donor_exact/FDT_VALIDATION.txt FDT_VALIDATION.txt
          sha256sum "$IMG" DONOR-REPRO-dtb-tail.img | tee compiled-hashes.txt

      - name: Package with donor boot-safe AnyKernel behavior
        run: |
          set -euxo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout --detach e4b1bb25ca2aabcfd57f694a5998d87130701b71
          rm -rf ak3/.git ak3/.github
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb.img ak3/dtbo.img
          cp kernel/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cp FDT_VALIDATION.txt ak3/FDT_VALIDATION.txt

          cat > ak3/anykernel.sh <<'AK3'
          ### AnyKernel3
          properties() { '
          kernel.string=MODE_CLONING DONOR REPRO | KSU 12701 | BOOT BASELINE
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print "MODE_CLONING DONOR REPRO";
          ui_print "Poco X3 NFC surya/karna - Android 10";
          ui_print "KSU Next kernel-side 12701";
          ui_print "Manual-only hooks / no LSM / KPROBES OFF";
          ui_print "NOUMOUNT";
          ui_print "Exact QASSA 12-DTB donor tail";
          ui_print "DTBO untouched";

          dump_boot;
          write_boot;
          AK3
          chmod 755 ak3/anykernel.sh

          cat > ak3/DONOR-REPRO-INFO.txt <<EOF
          Purpose: reproduce the known-booting donor before any KSU upgrade.
          Source: $KERNEL_COMMIT
          Defconfig blob: $EXPECTED_DEFCONFIG_BLOB
          KSU Next: v1.0.8 / 12701
          KSU commit: $KSU_COMMIT
          Toolchain commit: $TC_COMMIT
          Expected LLVM commit: $EXPECTED_LLVM_COMMIT
          KSU mode: manual-only; CONFIG_KSU supplied via KCFLAGS
          LSM KSU hooks: disabled
          KPROBES: disabled by donor config
          KSU_UMOUNT: disabled
          DTB SHA256: $EXPECTED_DTB_SHA256
          DTBO: untouched
          Installer: donor boot-safe behavior
          EOF

          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*' 'README.md' '*placeholder')
          unzip -tq "$ZIP_NAME"
          if unzip -l "$ZIP_NAME" | grep -q 'dtbo.img'; then
            echo "ERROR: DTBO must remain untouched"
            exit 1
          fi
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Publish donor reproduction release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: MODE_CLONING Surya A10 Donor Reproduction KSU12701
          prerelease: true
          body: |
            Diagnostic donor-reproduction baseline for Poco X3 NFC surya/karna Android 10.
            Goal: reproduce the known-booting QASSA donor before attempting any KSU upgrade.
            Source: donor-era StormBreaker 4.14.117 commit.
            KSU Next v1.0.8 / kernel-side 12701, manual-only integration, no KSU LSM hooks, KPROBES disabled, NOUMOUNT.
            Exact donor defconfig, exact donor-era Proton Clang, exact QASSA 12-DTB tail, donor-style AnyKernel installer, DTBO untouched.
            This is a runtime TEST baseline, not yet declared boot-stable.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
            ksu-kernel-version.txt
            compiler.txt
          fail_on_unmatched_files: true
