name: CahAzzu A11 Carbon Runtime Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cahazzu-a11-carbon-runtime-fix.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build A11 CahAzzu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio device-tree-compiler flex git libssl-dev \
            libelf-dev python3 zip unzip rsync

      - name: Fetch exact LineageOS 18.1 surya kernel
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_surya.git
          git fetch --depth=1 origin 0eb6e1b55bf716318866b9aad99e893357dbf201
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0eb6e1b55bf716318866b9aad99e893357dbf201"

      - name: Fetch Proton Clang
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          "$GITHUB_WORKSPACE/proton-clang/bin/clang" --version | head -n1

      - name: Integrate KernelSU Next v1.1.1
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.1.1/kernel/setup.sh | bash -s v1.1.1
          test -f KernelSU-Next/kernel/Kconfig
          git -C KernelSU-Next describe --tags --exact-match | grep -Fx v1.1.1

      - name: Configure CahAzzu A11
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: CahAzzu
          KBUILD_BUILD_HOST: CahAzzu
        run: |
          set -euxo pipefail
          export PATH="$PATH:$GITHUB_WORKSPACE/proton-clang/bin"
          COMMON=(
            O=out ARCH=arm64
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            READELF=llvm-readelf
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            DTC_EXT=/usr/bin/dtc
          )
          make "${COMMON[@]}" surya_defconfig

          scripts/config --file out/.config --set-str LOCALVERSION "-CahAzzu"
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL
          scripts/config --file out/.config -e KSU_KPROBES_HOOK
          scripts/config --file out/.config -d KSU_DEBUG
          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -d BUILD_ARM64_APPENDED_DTB_IMAGE

          make "${COMMON[@]}" olddefconfig

          grep -Fx 'CONFIG_KSU=y' out/.config
          grep -Fx 'CONFIG_KPROBES=y' out/.config
          grep -Fx 'CONFIG_KSU_KPROBES_HOOK=y' out/.config
          grep -Fx 'CONFIG_LOCALVERSION="-CahAzzu"' out/.config
          grep -Fx '# CONFIG_LOCALVERSION_AUTO is not set' out/.config
          grep -Fx '# CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set' out/.config

      - name: Build CahAzzu A11 Image only
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: CahAzzu
          KBUILD_BUILD_HOST: CahAzzu
        run: |
          set -o pipefail
          export PATH="$PATH:$GITHUB_WORKSPACE/proton-clang/bin"
          COMMON=(
            O=out ARCH=arm64
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            READELF=llvm-readelf
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            DTC_EXT=/usr/bin/dtc
          )
          make "${COMMON[@]}" -j"$(nproc)" Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build-a11.log"
          test -s out/arch/arm64/boot/Image.gz
          cat out/include/config/kernel.release
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Stage A11 payload
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/stage/Image.gz"
          cp out/.config "$GITHUB_WORKSPACE/stage/config"
          cp out/include/config/kernel.release "$GITHUB_WORKSPACE/stage/kernel.release"
          sha256sum "$GITHUB_WORKSPACE/stage/Image.gz" > "$GITHUB_WORKSPACE/stage/SHA256SUMS"

      - name: Upload A11 payload
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-a11-carbon
          path: stage/
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-a11-carbon-failure
          path: build-a11.log
          if-no-files-found: ignore

  package:
    name: Package CahAzzu.zip
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download A10 payload from Run 18
        uses: actions/download-artifact@v4
        with:
          name: CahAzzu-a10
          path: payload/a10
          repository: riwutzsitepu-prog/build-ksunex-surya
          run-id: 35878977711
          github-token: ${{ github.token }}

      - name: Download new A11 payload
        uses: actions/download-artifact@v4
        with:
          name: CahAzzu-a11-carbon
          path: payload/a11

      - name: Prepare universal AnyKernel3
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/rigaz29/surya-kernel-build.git packbase
          mkdir -p CahAzzu/variants/a10 CahAzzu/variants/a11
          cp -a packbase/anykernel/. CahAzzu/
          cp payload/a10/Image.gz CahAzzu/variants/a10/Image.gz
          cp payload/a11/Image.gz CahAzzu/variants/a11/Image.gz

          cat > CahAzzu/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## CahAzzu universal Android 10/11 for Poco X3 NFC (surya)

          properties() { '
          kernel.string=CahAzzu
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=10,11
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          mount /system 2>/dev/null || true
          mount /system_root 2>/dev/null || true
          mount /vendor 2>/dev/null || true

          sdk="";
          for p in \
            /system/build.prop \
            /system/system/build.prop \
            /system_root/system/build.prop \
            /system_root/system/system/build.prop; do
            if [ -f "$p" ]; then
              sdk=$(grep -m1 '^ro.build.version.sdk=' "$p" | cut -d= -f2 | tr -d '\r')
              [ -n "$sdk" ] && break
            fi
          done

          ui_print "- CahAzzu";
          ui_print "- Detected Android SDK: ${sdk:-unknown}";

          rm -f Image Image.gz Image.gz-dtb Image.lz4 zImage zImage-dtb dtb dtbo.img

          case "$sdk" in
            29)
              ui_print "- Android 10 detected";
              cp variants/a10/Image.gz Image.gz || abort "A10 payload missing";
              ;;
            30)
              ui_print "- Android 11 detected";
              cp variants/a11/Image.gz Image.gz || abort "A11 payload missing";
              ;;
            *)
              abort "CahAzzu supports Android 10/11 only (SDK 29/30).";
              ;;
          esac

          dump_boot;
          write_boot;
          EOF

          sed -i 's/^[[:space:]]\{10\}//' CahAzzu/anykernel.sh
          chmod 755 CahAzzu/anykernel.sh

      - name: Validate final package
        run: |
          set -euxo pipefail
          test -s CahAzzu/variants/a10/Image.gz
          test -s CahAzzu/variants/a11/Image.gz
          ! find CahAzzu -maxdepth 2 -type f \( -name 'dtb' -o -name 'dtbo.img' -o -name 'Image.gz-dtb' \) | grep .
          (
            cd CahAzzu
            zip -r9 ../CahAzzu.zip . -x '.git*' >/dev/null
          )
          unzip -t CahAzzu.zip
          sha256sum CahAzzu.zip > CahAzzu.zip.sha256
          cat CahAzzu.zip.sha256

      - name: Upload final CahAzzu
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu
          path: |
            CahAzzu.zip
            CahAzzu.zip.sha256
          if-no-files-found: error
