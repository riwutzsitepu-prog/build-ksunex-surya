name: CahAzzu A10 4.14.150 DonorLine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cahazzu-a10-414150-donorline.yml"
      - "scripts/cahazzu_manual_hooks.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: https://github.com/syahiddrakness/Kernel_Xiaomi_Surya-A10.git
      KERNEL_COMMIT: 23a7c2d5fcc40a89560542bf38c69a0f51778a49
      DEFCONFIG_BLOB: 1aab348ac65154d4ae1b17c09bfa639b1e3fc13e
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_COMMIT: 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553
      KSU_TAG: v1.1.1
      TC_REPO: https://github.com/kdrag0n/proton-clang.git
      TC_COMMIT: 08a35cd973e866932ca1b7f3e573293e0829c129
      EXPECTED_LLVM_COMMIT: 9829f5e6b1bca9b61efc629770d28bb9014dec45

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            make python3 python-is-python3 rsync unzip xz-utils zip zstd

      - name: Fetch donor-line StormBreaker 4.14.150
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -Fx 'VERSION = 4' Makefile
          grep -Fx 'PATCHLEVEL = 14' Makefile
          grep -Fx 'SUBLEVEL = 150' Makefile
          test -f arch/arm64/configs/Surya-stock_defconfig
          test "$(git hash-object arch/arm64/configs/Surya-stock_defconfig)" = "$DEFCONFIG_BLOB"

      - name: Fetch donor Proton Clang
        run: |
          set -euxo pipefail
          git init proton-clang
          cd proton-clang
          git remote add origin "$TC_REPO"
          git fetch --depth=1 origin "$TC_COMMIT"
          git checkout --detach FETCH_HEAD
          ./bin/clang --version | tee "$GITHUB_WORKSPACE/compiler.txt"
          grep -q "$EXPECTED_LLVM_COMMIT" "$GITHUB_WORKSPACE/compiler.txt"

      - name: Integrate KernelSU Next v1.1.1 manual-only
        working-directory: kernel
        run: |
          set -euxo pipefail
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "$KSU_TAG"
          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-y += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p=Path("KernelSU-Next/kernel/Makefile")
          s=p.read_text()
          s=s.replace("obj-$(CONFIG_KSU) += kernelsu.o","obj-y += kernelsu.o")
          s=s.replace("ccflags-y += -DKSU_UMOUNT\n","")
          start=s.find('ifneq ($(shell grep -Eq "^static int can_umount"')
          end=s.find('ifneq ($(shell grep -q "atomic_t filter_count;"')
          if start >= 0 and end > start:
              s=s[:start]+s[end:]
          p.write_text(s)
          PY
          grep -Fx 'obj-y += kernelsu.o' KernelSU-Next/kernel/Makefile
          ! grep -q 'ccflags-y += -DKSU_UMOUNT' KernelSU-Next/kernel/Makefile

      - name: Apply donor-safe manual hooks
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/cahazzu_manual_hooks.py"
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_execveat_ksud' fs/exec.c
          grep -q 'ksu_handle_prctl' security/security.c

      - name: Resolve donor-line legacy hook collisions
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          p=Path("fs/read_write.c")
          s=p.read_text()

          # 4.14.150 donor-line contains the old vfs_read KSU API.
          # KSU Next v1.1.1 manual mode uses the sys_read API instead.
          old_decl = r'''extern int ksu_handle_vfs_read\(struct file \*\*file_ptr, char __user \*\*buf_ptr,\s*size_t \*count_ptr, loff_t \*\*pos\);'''
          new_decl = '''extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr,
                               size_t *count_ptr);'''
          s,n = re.subn(old_decl,new_decl,s,count=1,flags=re.S)
          if n != 1 and "extern int ksu_handle_sys_read" not in s:
              raise SystemExit("old vfs_read declaration not found")

          old_call = r'''#ifdef CONFIG_KSU\s*#ifndef CONFIG_KPROBES\s*if \(unlikely\(ksu_vfs_read_hook\)\)\s*#endif\s*ksu_handle_vfs_read\(&file, &buf, &count, &pos\);\s*#endif'''
          s,n = re.subn(old_call,"",s,count=1,flags=re.S)
          if n != 1 and "ksu_handle_vfs_read(&file" in s:
              raise SystemExit("old vfs_read call not removed")

          if "ksu_handle_sys_read(fd, &buf, &count);" not in s:
              raise SystemExit("new sys_read hook missing")
          p.write_text(s)

          p=Path("fs/exec.c")
          s=p.read_text()

          # Replace the donor-line old execve KSU API with v1.1.1 declarations.
          decl_start=s.find("#ifdef CONFIG_KSU", s.find("sys_execve() executes"))
          fn_start=s.find("static int do_execveat_common", decl_start)
          if decl_start < 0 or fn_start < 0:
              raise SystemExit("exec KSU declaration block not found")
          NL=chr(10)
          decl=NL.join([
              "#ifdef CONFIG_KSU",
              "extern bool ksu_execveat_hook __read_mostly;",
              "extern int ksu_handle_execveat_ksud(int *fd, struct filename **filename_ptr,",
              "                                    struct user_arg_ptr *argv,",
              "                                    struct user_arg_ptr *envp, int *flags);",
              "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,",
              "                                        void *argv, void *envp, int *flags);",
              "#endif",
          ])+NL
          s=s[:decl_start]+decl+s[fn_start:]

          # Remove the second, legacy exec hook block inside do_execveat_common.
          legacy=re.compile(r'''#ifdef CONFIG_KSU\s*#ifndef CONFIG_KPROBES\s*if \(unlikely\(ksu_execveat_hook\)\)\s*ksu_handle_execveat\(&fd, &filename, &argv, &envp, &flags\);\s*else\s*ksu_handle_execveat_sucompat\(&fd, &filename, &argv, &envp, &flags\);\s*#else\s*ksu_handle_execveat\(&fd, &filename, &argv, &envp, &flags\);\s*#endif\s*#endif''',re.S)
          s,n=legacy.subn("",s,count=1)
          if n != 1 and "ksu_handle_execveat(&fd" in s:
              raise SystemExit("legacy exec hook block not removed")
          if "ksu_handle_execveat_ksud(&fd" not in s:
              raise SystemExit("v1.1.1 exec hook missing")
          p.write_text(s)

          p=Path("kernel/cgroup/cpuset.c")
          s=p.read_text()
          start=s.find("static ssize_t cpuset_write_resmask_assist")
          end=s.find("static ssize_t cpuset_write_resmask_wrapper", start)
          if start < 0 or end < 0:
              raise SystemExit("cpuset assist helper boundaries not found")
          prefix=s[max(0,start-64):start]
          if "#ifdef CONFIG_CPUSET_ASSIST" not in prefix:
              block=s[start:end]
              s=s[:start]+"#ifdef CONFIG_CPUSET_ASSIST"+NL+block+"#endif"+NL+NL+s[end:]
          p.write_text(s)
          PY

          ! grep -q 'ksu_handle_vfs_read(&file' fs/read_write.c
          grep -q 'extern int ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_sys_read(fd, &buf, &count);' fs/read_write.c
          ! grep -q 'ksu_handle_execveat(&fd' fs/exec.c
          grep -q 'extern int ksu_handle_execveat_ksud' fs/exec.c
          grep -q 'ksu_handle_execveat_ksud(&fd' fs/exec.c
          grep -B1 'static ssize_t cpuset_write_resmask_assist' kernel/cgroup/cpuset.c | grep -q '#ifdef CONFIG_CPUSET_ASSIST'

          # Run #7: restore the missing Qualcomm scheduler local CPU declaration.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("kernel/sched/fair.c")
          s=p.read_text()
          fn="void check_for_migration(struct rq *rq, struct task_struct *p)\n{\n"
          old=fn+"\tint active_balance;\n\tint new_cpu = -1;\n\tint prev_cpu = task_cpu(p);"
          new=fn+"\tint active_balance;\n\tint new_cpu = -1;\n\tint cpu = smp_processor_id();\n\tint prev_cpu = task_cpu(p);"
          if new not in s:
              if old not in s:
                  raise SystemExit("scheduler migration anchor not found")
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          grep -A6 -F 'void check_for_migration(struct rq *rq, struct task_struct *p)' kernel/sched/fair.c | grep -F 'int cpu = smp_processor_id();'

          # Run #8: keep exact donor config with STUNE_ASSIST disabled.
          # Fall back to the native writers when assist wrappers are not built.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("kernel/sched/tune.c")
          s=p.read_text()
          if "#define boost_write_wrapper boost_write" not in s:
              old="\treturn prefer_idle_write(css, cft, prefer_idle);\n}\n#endif\n"
              new="\treturn prefer_idle_write(css, cft, prefer_idle);\n}\n#else\n#define boost_write_wrapper boost_write\n#define prefer_idle_write_wrapper prefer_idle_write\n#endif\n"
              if old not in s:
                  raise SystemExit("schedtune wrapper anchor not found")
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          grep -A2 -F '#define boost_write_wrapper boost_write' kernel/sched/tune.c | grep -F '#define prefer_idle_write_wrapper prefer_idle_write'

          # Run #10: fix legacy HID trace include path for out-of-tree clang build.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/hid/hid-trace.h")
          s=p.read_text()
          old="#define TRACE_INCLUDE_PATH ."
          new="#define TRACE_INCLUDE_PATH ../../drivers/hid"
          if new not in s:
              if old not in s:
                  raise SystemExit("hid trace include anchor not found")
              p.write_text(s.replace(old,new,1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/hid' drivers/hid/hid-trace.h

          # Run #13: fix the two IPA trace headers that fail in the same out-of-tree build.
          python3 - <<'PY'
          from pathlib import Path
          patches = {
              "drivers/platform/msm/ipa/ipa_v3/ipa_trace.h":
                  "../../drivers/platform/msm/ipa/ipa_v3",
              "drivers/platform/msm/ipa/ipa_clients/rndis_ipa_trace.h":
                  "../../drivers/platform/msm/ipa/ipa_clients",
          }
          for name, path in patches.items():
              p=Path(name)
              s=p.read_text()
              old="#define TRACE_INCLUDE_PATH ."
              new=f"#define TRACE_INCLUDE_PATH {path}"
              if new not in s:
                  if old not in s:
                      raise SystemExit(f"trace include anchor not found: {name}")
                  p.write_text(s.replace(old,new,1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/platform/msm/ipa/ipa_v3' drivers/platform/msm/ipa/ipa_v3/ipa_trace.h
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/platform/msm/ipa/ipa_clients' drivers/platform/msm/ipa/ipa_clients/rndis_ipa_trace.h

          # Run #10: legacy HID trace header must use a source-relative include path.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/hid/hid-trace.h")
          s=p.read_text()
          old="#define TRACE_INCLUDE_PATH ."
          new="#define TRACE_INCLUDE_PATH ../../drivers/hid"
          if new not in s:
              if old not in s:
                  raise SystemExit("HID trace include anchor not found")
              p.write_text(s.replace(old,new,1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/hid' drivers/hid/hid-trace.h

          # Run #11: legacy Qualcomm camera trace header include path.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/media/platform/msm/camera/cam_utils/cam_trace.h")
          s=p.read_text()
          old="#define TRACE_INCLUDE_PATH ."
          new="#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils"
          if new not in s:
              if old not in s:
                  raise SystemExit("camera trace include anchor not found")
              p.write_text(s.replace(old,new,1))
          PY
          grep -Fn '#define TRACE_INCLUDE_PATH ../../drivers/media/platform/msm/camera/cam_utils' drivers/media/platform/msm/camera/cam_utils/cam_trace.h

      - name: Configure exact donor defconfig
        working-directory: kernel
        run: |
          set -euxo pipefail
          cp arch/arm64/configs/Surya-stock_defconfig .config
          test "$(git hash-object .config)" = "$DEFCONFIG_BLOB"

          # Same donor-required topology values used by the known QASSA donor reproduction.
          sed -i 's/^CONFIG_LITTLE_CPU_MASK=$/CONFIG_LITTLE_CPU_MASK=63/' .config
          sed -i 's/^CONFIG_BIG_CPU_MASK=$/CONFIG_BIG_CPU_MASK=192/' .config
          scripts/config --file .config --set-val LITTLE_CPU_MASK 63
          scripts/config --file .config --set-val BIG_CPU_MASK 192

          scripts/config --file .config --set-str LOCALVERSION "-CahAzzu"
          scripts/config --file .config -d LOCALVERSION_AUTO

          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make ARCH=arm64 olddefconfig

          grep -Fx 'CONFIG_LITTLE_CPU_MASK=63' .config
          grep -Fx 'CONFIG_BIG_CPU_MASK=192' .config
          grep -Fx '# CONFIG_KPROBES is not set' .config
          grep -Fx 'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' .config
          grep -Fx 'CONFIG_IMG_GZ_DTB=y' .config
          grep -Fx 'CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=y' .config
          grep -Fx 'CONFIG_AW8624_HAPTIC=y' .config
          grep -Fx 'CONFIG_DRV2624_HAPTIC=y' .config
          grep -Fx 'CONFIG_OVERLAY_FS=y' .config
          grep -Fx 'CONFIG_LOCALVERSION="-CahAzzu"' .config
          grep -Fx '# CONFIG_LOCALVERSION_AUTO is not set' .config
          cp .config "$GITHUB_WORKSPACE/CahAzzu.config"

      - name: Build native CahAzzu 4.14.150 Image.gz-dtb
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=CahAzzu
          export KBUILD_BUILD_HOST=CahAzzu
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS='-DCONFIG_KSU'

          make -j"$(nproc)" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS='-DCONFIG_KSU' \
            Image.gz-dtb 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test -s arch/arm64/boot/Image.gz-dtb

      - name: Validate kernel
        working-directory: kernel
        run: |
          set -euxo pipefail
          cp arch/arm64/boot/Image.gz-dtb "$GITHUB_WORKSPACE/Image.gz-dtb"
          python3 - <<'PY'
          import zlib
          from pathlib import Path
          blob=Path("../Image.gz-dtb").read_bytes()
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          raw=d.decompress(blob)+d.flush()
          tail=d.unused_data
          Path("../CahAzzu-Image").write_bytes(raw)
          Path("../CahAzzu-native-dtb-tail.img").write_bytes(tail)
          if not tail:
              raise SystemExit("native DTB tail missing")
          PY
          cd "$GITHUB_WORKSPACE"
          strings CahAzzu-Image | grep -m1 '^Linux version ' | tee kernel-version.txt
          strings CahAzzu-Image | grep -q '4.14.150-CahAzzu'
          strings CahAzzu-Image | grep -q '/data/adb/ksud'
          KSU_KERNEL_VERSION="$(grep -oE 'KernelSU-Next version: [0-9]+' build.log | tail -n1 | awk '{print $3}')"
          test -n "$KSU_KERNEL_VERSION"
          test "$KSU_KERNEL_VERSION" -ge 12797
          echo "KernelSU Next kernel-side version: $KSU_KERNEL_VERSION" | tee ksu-kernel-version.txt
          sha256sum Image.gz-dtb CahAzzu-native-dtb-tail.img | tee compiled-hashes.txt

      - name: Package CahAzzu
        run: |
          set -euxo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          git -C ak3 checkout --detach e4b1bb25ca2aabcfd57f694a5998d87130701b71
          rm -rf ak3/.git ak3/.github
          rm -f ak3/Image ak3/Image.gz ak3/Image.gz-dtb ak3/dtb ak3/dtb.img ak3/dtbo.img
          cp Image.gz-dtb ak3/Image.gz-dtb
          cp kernel-version.txt ak3/kernel-version.txt
          cp ksu-kernel-version.txt ak3/ksu-kernel-version.txt

          cat > ak3/anykernel.sh <<'AK3'
          ### AnyKernel3
          properties() { '
          kernel.string=CahAzzu
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=10
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;

          ui_print "CahAzzu";
          ui_print "Linux 4.14.150";
          ui_print "KernelSU Next v1.1.1";
          ui_print "Donor-line native surya DTB";
          ui_print "DTBO untouched";

          dump_boot;
          write_boot;
          AK3
          sed -i 's/^[[:space:]]\{10\}//' ak3/anykernel.sh
          chmod 755 ak3/anykernel.sh

          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/CahAzzu.zip" . -x '*.git*' 'README.md' '*placeholder' >/dev/null)
          unzip -tq CahAzzu.zip
          unzip -l CahAzzu.zip | grep 'Image.gz-dtb'
          ! unzip -l CahAzzu.zip | grep -q 'dtbo.img'
          sha256sum CahAzzu.zip | tee CahAzzu.zip.sha256

      - name: Upload final CahAzzu
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-4.14.150
          path: |
            CahAzzu.zip
            CahAzzu.zip.sha256
            kernel-version.txt
            ksu-kernel-version.txt
            compiled-hashes.txt
            CahAzzu.config
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-4.14.150-failure
          path: |
            build.log
            compiler.txt
            CahAzzu.config
          if-no-files-found: ignore
