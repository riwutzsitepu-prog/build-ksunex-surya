name: RiwutOS11 SUSFS compatibility probe
on:
  push:
    branches: [riwutos11-v3-diagnostic]
    paths:
      - 'riwutos11/susfs-probe.sh'
      - '.github/workflows/riwutos11-susfs-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  susfs-patch-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel object build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex make libssl-dev libelf-dev clang lld llvm binutils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          command -v clang
          command -v ld.lld
      - name: Check upstream SUSFS 4.14 patch against pinned XRadens source
        run: bash riwutos11/susfs-probe.sh
      - name: Validate compiled object integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          status=output/susfs-object-status.txt
          object=output/susfs-enabled-obj/fs/susfs.o
          test -s "$status"
          grep -Fxq 'SUSFS object compile exit code: 0' "$status"
          test -s "$object"
          file "$object" | tee output/susfs-integrity.txt
          readelf -h "$object" | grep -E 'Class:|Machine:|Type:' | tee -a output/susfs-integrity.txt
          readelf -h "$object" | grep -q 'AArch64'
          for symbol in susfs_init susfs_set_uname susfs_spoof_uname susfs_add_sus_mount susfs_add_sus_kstat susfs_add_sus_path susfs_add_open_redirect; do
            if ! llvm-nm --defined-only --extern-only "$object" | awk '{print $3}' | grep -Fxq "$symbol"; then
              echo "MISSING REQUIRED SYMBOL: $symbol" | tee -a output/susfs-integrity.txt
              exit 1
            fi
            echo "Verified symbol: $symbol" >> output/susfs-integrity.txt
          done
          for feature in KSU_SUSFS KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SUS_PATH KSU_SUSFS_OPEN_REDIRECT; do
            grep -Fxq "CONFIG_${feature}=y" output/susfs-enabled-obj/.config || { echo "Missing enabled config: $feature"; exit 1; }
          done
          sha256sum "$object" | tee -a output/susfs-integrity.txt
          echo 'PASS: AArch64 SUSFS object present and nonempty; kernel linking and boot remain unverified.' | tee -a output/susfs-integrity.txt
      - name: Publish findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiwutOS11-SUSFS-PATCH-CHECK-NOT-FLASHABLE
          path: |
            output/susfs-patch-status.txt
            output/susfs-patch-check.log
            output/susfs-backport-status.txt
            output/susfs-backport-check.log
            output/susfs-partial-apply.log
            output/susfs-partial-status.txt
            output/susfs-core-status.txt
            output/susfs-diff-check.txt
            output/susfs-diff-check-after-cleanup.txt
            output/susfs-kconfig-audit.txt
            output/susfs-ksu-compat.log
            output/susfs-ksu-compat-status.txt
            output/susfs-ksu-layout-map.txt
            output/susfs-ksu-relocation-map.txt
            output/susfs-ksu-api-audit.txt
            output/susfs-ksu-kconfig-stage.txt
            output/susfs-config-test.log
            output/susfs-config-test-status.txt
            output/susfs-enabled-config.log
            output/susfs-enabled-status.txt
            output/susfs-object-build.log
            output/susfs-object-status.txt
            output/susfs-undefined-symbols.txt
            output/susfs-link-preflight-status.txt
            output/susfs-object-content-audit.txt
            output/susfs-integrity.txt
            output/susfs-full-link.log
            output/susfs-full-link-status.txt
            output/susfs-partial-rejects/
