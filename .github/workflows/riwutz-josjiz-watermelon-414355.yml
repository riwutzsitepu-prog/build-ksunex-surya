name: riwutz_josjiz Watermelon 4.14.355

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riwutz-josjiz-watermelon-414355.yml'
      - 'scripts/riwutz_josjiz_ksu_compat.py'
      - 'scripts/riwutz_josjiz_kernel_compat.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      KERNEL_REPO: https://github.com/xradens/msm-4.14.git
      KERNEL_COMMIT: 95dffb0397b21a8a54fefec47801ab460be5532f
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_TAG: v1.1.1
      KSU_COMMIT: 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553
      SUSFS_REPO: https://github.com/sidex15/susfs4ksu-begonia.git
      SUSFS_BRANCH: kernel-4.14
      AK3_REPO: https://github.com/xradens/AnyKernel3.git
      AK3_BRANCH: watermelon
      KERNEL_NAME: riwutz_josjiz
      ZIP_NAME: riwutz_josjiz.zip
      CLANG_URL: https://github.com/greenforce-project/greenforce_clang/releases/download/24072024/greenforce-clang-20.0.0git-24072024.tar.zst
      CLANG_SHA256: 1bdea29ba34c13b672803d3ef26adbb955a33cb79cd4b6c8a6e01f545b61da52
      LLVM_COMMIT: fad17b43dbc09ac7e0a95535459845f72c2b739a

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex git \
            libelf-dev libssl-dev make patch python3 rsync unzip xz-utils zip zstd

      - name: Checkout exact Watermelon 4.14.355 source
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 355$' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/watermelon-source-sha.txt"

      - name: Prepare pinned Watermelon clang 20 toolchain
        run: |
          set -euxo pipefail
          mkdir -p tc/extract tc/clang-20
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/greenforce-clang-20.tar.zst "$CLANG_URL"
          echo "$CLANG_SHA256  /tmp/greenforce-clang-20.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/greenforce-clang-20.tar.zst -C tc/extract
          CLANG_BIN="$(find tc/extract -path '*/bin/clang' -print -quit)"
          test -n "$CLANG_BIN"
          CLANG_ROOT="$(dirname "$(dirname "$CLANG_BIN")")"
          cp -a "$CLANG_ROOT"/. tc/clang-20/
          test -x tc/clang-20/bin/clang
          tc/clang-20/bin/clang --version | head -n3 | tee compiler.txt
          grep -q "$LLVM_COMMIT" compiler.txt

      - name: Integrate KernelSU Next v1.1.1 and SUSFS
        run: |
          set -euxo pipefail
          git clone --branch "$KSU_TAG" --single-branch "$KSU_REPO" ksu-next
          test "$(git -C ksu-next rev-parse HEAD)" = "$KSU_COMMIT"
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs

          cd ksu-next
          set +e
          patch -p1 --forward < ../susfs/kernel_patches/0001-KernelSU-Next-Implement-susfs-v1.5.3-plus-non-gki.patch
          KSU_PATCH_RC=$?
          set -e
          if [ "$KSU_PATCH_RC" -ne 0 ]; then
            mapfile -t REJECTS < <(find kernel -name '*.rej' -print | sort)
            printf 'Known SUSFS/KSU v1.1.1 rejects:\n%s\n' "${REJECTS[*]}"
            test "${#REJECTS[@]}" -eq 2
            test "${REJECTS[0]}" = "kernel/core_hook.c.rej"
            test "${REJECTS[1]}" = "kernel/selinux/rules.c.rej"
          fi
          cd ..

          python3 scripts/riwutz_josjiz_ksu_compat.py
          find ksu-next/kernel -name '*.rej' -delete
          find ksu-next/kernel -name '*.orig' -delete
          grep -q '^KSU_VERSION := 12851$' ksu-next/kernel/Makefile
          grep -q 'bool susfs_is_allow_su(void)' ksu-next/kernel/core_hook.c
          grep -q 'susfs_try_umount_all(new_uid.val)' ksu-next/kernel/core_hook.c
          grep -q 'void ksu_apply_kernelsu_rules()' ksu-next/kernel/selinux/rules.c
          grep -q 'int ksu_handle_sepolicy' ksu-next/kernel/selinux/rules.c
          grep -q 'susfs_set_zygote_sid' ksu-next/kernel/selinux/rules.c
          git -C ksu-next diff --check

          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('susfs/kernel_patches/0002-fs-Implement-susfs-v1.5.3.patch').read_text()
          parts = src.split('diff --git ')
          out = [parts[0]]
          for part in parts[1:]:
              first = part.splitlines()[0] if part.splitlines() else ''
              m = re.match(r'a/(\S+) b/(\S+)', first)
              if m and (m.group(1).endswith('.rej') or m.group(2).endswith('.rej')):
                  continue
              out.append('diff --git ' + part)
          Path('/tmp/susfs-kernel-clean.patch').write_text(''.join(out))
          PY

          cd kernel
          set +e
          patch -p1 --forward < /tmp/susfs-kernel-clean.patch
          KERNEL_PATCH_RC=$?
          set -e
          if [ "$KERNEL_PATCH_RC" -ne 0 ]; then
            mapfile -t REJECTS < <(find . -name '*.rej' -print | sed 's#^./##' | sort)
            printf 'Known Watermelon 4.14.355 SUSFS rejects:\n%s\n' "${REJECTS[*]}"
            test "${#REJECTS[@]}" -eq 4
            test "${REJECTS[0]}" = "fs/dcache.c.rej"
            test "${REJECTS[1]}" = "fs/proc/cmdline.c.rej"
            test "${REJECTS[2]}" = "fs/proc/task_mmu.c.rej"
            test "${REJECTS[3]}" = "kernel/sys.c.rej"
          fi
          cd ..

          python3 scripts/riwutz_josjiz_kernel_compat.py
          find kernel -name '*.rej' -delete
          find kernel -name '*.orig' -delete

          test -f kernel/fs/susfs.c
          test -f kernel/include/linux/susfs.h
          grep -q 'susfs_spoof_cmdline_or_bootconfig' kernel/fs/proc/cmdline.c
          grep -q 'susfs_sus_ino_for_show_map_vma' kernel/fs/proc/task_mmu.c
          grep -q 'susfs_spoof_uname(&tmp)' kernel/kernel/sys.c
          grep -q 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' kernel/fs/dcache.c
          ! find kernel -name '*.rej' -print -quit | grep -q .

          rm -rf kernel/drivers/kernelsu
          ln -s ../../ksu-next/kernel kernel/drivers/kernelsu
          grep -q 'kernelsu' kernel/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          test -f kernel/drivers/kernelsu/Kconfig

      - name: Apply targeted Wi-Fi toggle stabilization patch
        run: |
          set -euxo pipefail
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/staging/qcacld-3.0/Kbuild')
          s = p.read_text()
          old = 'ifneq ($(CONFIG_IRQ_SBALANCE), y)\ncppflags-y += -DHIF_IRQ_AFFINITY\nendif\n'
          if old not in s:
              raise SystemExit('Expected HIF_IRQ_AFFINITY block not found')
          p.write_text(s.replace(old, '', 1))
          PY
          ! grep -A4 -B2 'FEATURE_NAPI' drivers/staging/qcacld-3.0/Kbuild | grep -q HIF_IRQ_AFFINITY
          git diff -- drivers/staging/qcacld-3.0/Kbuild | tee "$GITHUB_WORKSPACE/wifi-fix.diff"

      - name: Build A11-A12 payload
        run: |
          set -euxo pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/tc/clang-20/bin:$PATH"
          export KBUILD_BUILD_USER=riwutz
          export KBUILD_BUILD_HOST=josjiz
          rm -rf out
          make LLVM=1 surya_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION "-$KERNEL_NAME"
          scripts/config --file out/.config --disable LOCALVERSION_AUTO
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_SUSFS
          scripts/config --file out/.config --disable KSU_SUSFS_SUS_SU
          make LLVM=1 olddefconfig
          grep -q '^CONFIG_LOCALVERSION="-riwutz_josjiz"$' out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS_SUS_SU is not set$' out/.config
          make -j"$(nproc)" LLVM=1 Image.gz dtb.img dtbo.img 2>&1 | tee "$GITHUB_WORKSPACE/build-a11-a12.log"
          mkdir -p "$GITHUB_WORKSPACE/payload/a11_a12"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/payload/a11_a12/"
          cp out/arch/arm64/boot/dtb.img "$GITHUB_WORKSPACE/payload/a11_a12/"
          cp out/arch/arm64/boot/dtbo.img "$GITHUB_WORKSPACE/payload/a11_a12/"

      - name: Build Android 10 payload with SchedTune compatibility
        run: |
          set -euxo pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/tc/clang-20/bin:$PATH"
          export KBUILD_BUILD_USER=riwutz
          export KBUILD_BUILD_HOST=josjiz
          rm -rf out
          make LLVM=1 surya_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION "-$KERNEL_NAME"
          scripts/config --file out/.config --disable LOCALVERSION_AUTO
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_SUSFS
          scripts/config --file out/.config --disable KSU_SUSFS_SUS_SU
          scripts/config --file out/.config --disable UCLAMP_TASK
          scripts/config --file out/.config --disable UCLAMP_TASK_GROUP
          scripts/config --file out/.config --enable SCHED_TUNE
          make LLVM=1 olddefconfig
          grep -q '^CONFIG_LOCALVERSION="-riwutz_josjiz"$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_SCHED_TUNE=y$' out/.config
          ! grep -q '^CONFIG_UCLAMP_TASK=y$' out/.config
          make -j"$(nproc)" LLVM=1 Image.gz dtb.img dtbo.img 2>&1 | tee "$GITHUB_WORKSPACE/build-a10.log"
          mkdir -p "$GITHUB_WORKSPACE/payload/a10"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/payload/a10/"
          cp out/arch/arm64/boot/dtb.img "$GITHUB_WORKSPACE/payload/a10/"
          cp out/arch/arm64/boot/dtbo.img "$GITHUB_WORKSPACE/payload/a10/"

      - name: Package one autodetect A10-A12 AnyKernel ZIP
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3
          rm -rf AnyKernel3/.git
          rm -f AnyKernel3/Image AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb AnyKernel3/dtb AnyKernel3/dtb.img AnyKernel3/dtbo.img
          mkdir -p AnyKernel3/payload/a10 AnyKernel3/payload/a11_a12
          cp payload/a10/* AnyKernel3/payload/a10/
          cp payload/a11_a12/* AnyKernel3/payload/a11_a12/

          cat > AnyKernel3/anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## riwutz_josjiz universal Watermelon 4.14.355

          properties() { '
          kernel.string=riwutz_josjiz
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=surya
          device.name2=karna
          supported.versions=10-12
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          AK3DIR="$(pwd)"
          . tools/ak3-core.sh;

          ROMVER=""
          for PROP in /system/build.prop /system/system/build.prop /system_root/system/build.prop /vendor/build.prop; do
            if [ -f "$PROP" ]; then
              ROMVER="$(grep -m1 '^ro.build.version.release=' "$PROP" 2>/dev/null | cut -d= -f2)"
              [ -n "$ROMVER" ] && break
            fi
          done
          [ -n "$ROMVER" ] || ROMVER="$(getprop ro.build.version.release 2>/dev/null)"

          case "$ROMVER" in
            10*) PAYLOAD=a10 ;;
            11*|12*) PAYLOAD=a11_a12 ;;
            *) abort "Unsupported/undetected Android version: $ROMVER (need Android 10, 11 or 12)" ;;
          esac

          ui_print " ";
          ui_print "- Kernel: riwutz_josjiz";
          ui_print "- Watermelon base: 4.14.355";
          ui_print "- Detected Android: $ROMVER";
          ui_print "- Selected payload: $PAYLOAD";
          ui_print " ";

          cp -f "$AK3DIR/payload/$PAYLOAD/Image.gz" "$AK3DIR/Image.gz" || abort "Image copy failed";
          cp -f "$AK3DIR/payload/$PAYLOAD/dtb.img" "$AK3DIR/dtb.img" || abort "DTB copy failed";
          cp -f "$AK3DIR/payload/$PAYLOAD/dtbo.img" "$AK3DIR/dtbo.img" || abort "DTBO copy failed";

          dump_boot;
          write_boot;
          AK3

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x '*.git*' 'README.md' '*placeholder*'
          cd ..
          unzip -t "$ZIP_NAME"
          test -s "$ZIP_NAME"
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Upload riwutz_josjiz package and logs
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz
          if-no-files-found: error
          retention-days: 30
          path: |
            riwutz_josjiz.zip
            riwutz_josjiz.zip.sha256
            build-a10.log
            build-a11-a12.log
            compiler.txt
            wifi-fix.diff
            watermelon-source-sha.txt
