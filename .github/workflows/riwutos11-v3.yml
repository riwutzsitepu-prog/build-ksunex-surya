name: RiwutOS11 V3 compile diagnostic
on:
  push:
    branches: [riwutos11-v3-diagnostic]
    paths:
      - 'riwutos11/**'
      - '.github/workflows/riwutos11-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex make libssl-dev libelf-dev python3 clang lld llvm binutils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf ccache zip
      - name: Diagnostic compile
        shell: bash
        run: |
          set -o pipefail
          bash riwutos11/build.sh 2>&1 | tee riwutos11-build.log
      - name: Enforce diagnostic-only release gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s output/STATUS.txt
          grep -q 'NOT FLASHABLE' output/STATUS.txt
          test -s output/readiness-audit.txt
          grep -Fxq 'READY TO FLASH: NO' output/readiness-audit.txt
          grep -Fxq 'susfs_source: False' output/readiness-audit.txt
          grep -Fxq 'manual_execve_sucompat_hook: False' output/readiness-audit.txt
          grep -Fxq 'manual_execveat_sucompat_hook: False' output/readiness-audit.txt
          gzip -t output/Image.gz
          sha256sum -c output/sha256.txt
          echo 'PASS: Base kernel image is a verified diagnostic artifact only.'
      - name: Publish integration blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('output/readiness-audit.txt').read_text().splitlines()
          checks={}
          for line in lines:
              if ': ' in line:
                  key,value=line.split(': ',1)
                  checks[key]=value
          blockers={
              'manual_execve_sucompat_hook':'KernelSU manual execve integration missing',
              'manual_execveat_sucompat_hook':'KernelSU manual execveat integration missing',
              'susfs_source':'SUSFS source is absent from primary kernel build',
          }
          outstanding=[message for key,message in blockers.items() if checks.get(key)!='True']
          report=['RIWUTOS11 INTEGRATION GAP REPORT','Kernel image: diagnostic only']
          report.extend(f'- {item}' for item in outstanding)
          report.append('- Full kernel linking with SUSFS: not tested')
          report.append('- Boot validation on surya: not tested')
          report.append('- OrangeFox flashable ZIP: not available')
          Path('output/integration-gaps.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiwutOS11-V3-DIAGNOSTIC-NOT-FLASHABLE
          path: |
            riwutos11-build.log
            output/STATUS.txt
            output/source-commit.txt
            output/obj/.config
            output/Image.gz
            output/sha256.txt
            output/readiness-audit.txt
            output/integration-gaps.txt
          if-no-files-found: warn
