name: RiwutOS11 4.14.355 without SUSFS
on:
  push:
    branches: [riwutos11-v3-diagnostic]
    paths:
      - 'riwutos11/**'
      - '.github/workflows/riwutos11-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex make libssl-dev libelf-dev python3 clang lld llvm binutils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf ccache zip
      - name: Diagnostic compile
        shell: bash
        run: |
          set -o pipefail
          bash riwutos11/build.sh 2>&1 | tee riwutos11-build.log
      - name: Enforce diagnostic-only release gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s output/STATUS.txt
          grep -q 'NOT FLASHABLE' output/STATUS.txt
          test -s output/readiness-audit.txt
          grep -Fxq 'READY TO FLASH: NO' output/readiness-audit.txt
          grep -Fxq 'susfs_source: False' output/readiness-audit.txt
          grep -Fxq 'manual_execve_sucompat_hook: False' output/readiness-audit.txt
          grep -Fxq 'manual_execveat_sucompat_hook: False' output/readiness-audit.txt
          gzip -t output/Image.gz
          sha256sum -c output/sha256.txt
          test -s output/dtb-status.txt
          test -s output/dtb-sha256.txt
          sha256sum -c output/dtb-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          dtbs=list(Path('output/dtb').rglob('*.dtb'))
          assert dtbs, 'Missing base DTB'
          for dtb in dtbs:
              blob=dtb.read_bytes()
              assert len(blob)>=40, f'Truncated DTB: {dtb}'
              magic,total=struct.unpack_from('>II',blob)
              assert magic==0xd00dfeed, f'Invalid FDT magic: {dtb}'
              assert total<=len(blob) and total>=40, f'Invalid DTB size: {dtb}'
              assert dtb.name=='sdmmagpie.dtb', f'Unexpected DTB variant: {dtb}'
              print(f'PASS: FDT header {dtb.name}, {total} bytes')
          PY
          echo 'PASS: Device tree blobs built and hashed; no boot validation.'

          python3 - <<'PY'
          from pathlib import Path
          import gzip
          image=Path('output/Image.gz')
          with gzip.open(image,'rb') as stream:
              header=stream.read(0x40)
          assert len(header)==0x40, 'Truncated ARM64 Image header'
          magic=int.from_bytes(header[0x38:0x3c], 'little')
          assert magic==0x644d5241, f'Invalid ARM64 Image magic: 0x{magic:08x}'
          size=int.from_bytes(header[0x10:0x18], 'little')
          assert size>0, 'Invalid ARM64 Image header size'
          print(f'PASS: ARM64 Image header magic, declared size {size} bytes')
          expected='81d2f9e9aa231fa3467c190e88e6c94fb76ccaa7'
          recorded=Path('output/source-commit.txt').read_text()
          assert expected in recorded, 'Kernel source pin does not match expected commit'
          print('PASS: Pinned surya source commit recorded')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output/handoff-manifest.json').read_text())
          assert m['ready_to_flash'] is False
          assert m['boot_img']=='NOT PROVIDED'
          assert m['dtbo_img']=='NOT VERIFIED'
          assert len(m['base_dtbs'])==1
          print('PASS: No-SUSFS handoff manifest and flash safety gate')
          PY
          echo 'PASS: Base kernel image is a verified diagnostic artifact only.'
      - name: Publish integration blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('output/readiness-audit.txt').read_text().splitlines()
          checks={}
          for line in lines:
              if ': ' in line:
                  key,value=line.split(': ',1)
                  checks[key]=value
          outstanding=[
              'Manual KernelSU execve/execveat runtime hooks have not been verified',
              'DTBO compatibility with target ROM has not been verified',
              'Boot image repacking against target ROM has not been verified',
              'Boot validation on surya has not been performed',
              'OrangeFox flashable ZIP is not available',
          ]
          report=['RIWUTOS11 RELEASE READINESS REPORT',
                  'Kernel variant: 4.14.355 without SUSFS',
                  'Image.gz and base DTB: build/format validation only']
          report.extend(f'- {item}' for item in outstanding)
          Path('output/integration-gaps.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          summary=Path(__import__('os').environ.get('GITHUB_STEP_SUMMARY','output/integration-summary.md'))
          summary.write_text('## RiwutOS11 — No SUSFS diagnostic build\n\n'
                             + '\n'.join('- '+item for item in outstanding)
                             + '\n\n**Not flashable:** target-ROM DTBO, boot image and on-device compatibility remain unverified.\n')
          PY
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiwutOS11-V3-DIAGNOSTIC-NOT-FLASHABLE
          path: |
            riwutos11-build.log
            output/STATUS.txt
            output/source-commit.txt
            output/obj/.config
            output/Image.gz
            output/sha256.txt
            output/dtb-status.txt
            output/dtb-sha256.txt
            output/handoff-manifest.json
            output/dtb/
            output/ksu-link-audit.txt
            output/readiness-audit.txt
            output/integration-gaps.txt
          if-no-files-found: warn
