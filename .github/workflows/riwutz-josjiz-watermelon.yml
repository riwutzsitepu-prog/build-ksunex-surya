name: riwutz_josjiz Watermelon 4.14.355

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riwutz-josjiz-watermelon.yml'
      - 'patches/riwutz_josjiz-wifi-power-cycle.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/xradens/msm-4.14.git
      KERNEL_COMMIT: 95dffb0397b21a8a54fefec47801ab460be5532f
      WIFI_FIX_COMMIT: 238de8f97899fb0f945493f7075c3cd3483f69f1
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_COMMIT: 0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553
      KSU_TAG: v1.1.1
      KSU_VERSION_EXPECTED: '12851'
      CLANG_URL: https://github.com/greenforce-project/greenforce_clang/releases/download/26012025/greenforce-clang-20.0.0git-26012025.tar.xz
      CLANG_SHA256: 6350e8a4d8f50e43ebc37b8714ca7381175b8c1b56db6a94b74d8109956a2c0c
      ZIP_NAME: riwutz_josjiz.zip

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl file flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev \
            make python3 python-is-python3 rsync unzip xz-utils zip zstd

      - name: Clone exact Watermelon 4.14.355 baseline
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 355$' Makefile
          test -f arch/arm64/configs/surya_defconfig
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/watermelon-base.txt"

      - name: Apply targeted Wi-Fi power-cycle fix
        run: |
          set -euxo pipefail
          cd kernel
          PATCH="$GITHUB_WORKSPACE/patches/riwutz_josjiz-wifi-power-cycle.patch"
          test -s "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          git diff -- drivers/staging/qcacld-3.0/core/mac/src/sys/common/src/wlan_qct_sys.c | tee "$GITHUB_WORKSPACE/wifi-fix.txt"
          grep -n 'qdf_event_set(stop_evt)' drivers/staging/qcacld-3.0/core/mac/src/sys/common/src/wlan_qct_sys.c
          if grep -A14 -B3 'static void umac_stop_complete_cb' drivers/staging/qcacld-3.0/core/mac/src/sys/common/src/wlan_qct_sys.c | grep -q '#ifdef QDF_ENABLE_TRACING'; then
            echo 'Wi-Fi fix was not applied cleanly' >&2
            exit 1
          fi
          echo "Source fix: $WIFI_FIX_COMMIT" >> "$GITHUB_WORKSPACE/wifi-fix.txt"

      - name: Prepare ClangBuiltLinux 20 toolchain
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 "$CLANG_URL" -o clang.tar.xz
          echo "$CLANG_SHA256  clang.tar.xz" | sha256sum -c -
          mkdir -p clang
          tar -xJf clang.tar.xz -C clang --strip-components=1
          test -x clang/bin/clang
          test -x clang/bin/ld.lld
          clang/bin/clang --version | head -n 3 | tee compiler.txt
          clang/bin/clang --version | grep -E 'clang version 20|20\.0\.0'

      - name: Integrate KernelSU Next v1.1.1 driver 12851
        run: |
          set -euxo pipefail
          cd kernel
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "$KSU_TAG"

          KSU_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSU_VERSION="$((10000 + KSU_COUNT + 200))"
          echo "KSU_COUNT=$KSU_COUNT"
          echo "KSU_VERSION=$KSU_VERSION" | tee "$GITHUB_WORKSPACE/ksunext-version.txt"
          test "$KSU_VERSION" = "$KSU_VERSION_EXPECTED"

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Watermelon already contains manual KSU hooks for exec/open/read/stat/input.
          # KSU Next v1.1.1 provides devpts handling through its LSM inode hook on 4.14.
          sed -i 's/ksu_handle_execveat(/ksu_handle_execveat_ksud(/g' fs/exec.c
          grep -q 'ksu_handle_execveat_ksud' fs/exec.c
          grep -q 'ksu_handle_execveat_sucompat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_vfs_read' fs/read_write.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_devpts' KernelSU-Next/kernel/core_hook.c

      - name: Configure riwutz_josjiz
        run: |
          set -euxo pipefail
          cd kernel
          cp arch/arm64/configs/surya_defconfig arch/arm64/configs/riwutz_josjiz_defconfig

          # Keep Linux 4.14.355 but expose exactly one custom kernel name.
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          ./scripts/config --file arch/arm64/configs/riwutz_josjiz_defconfig \
            --set-str LOCALVERSION '-riwutz_josjiz' \
            -d LOCALVERSION_AUTO \
            -e OVERLAY_FS \
            -e KSU \
            -d KSU_KPROBES_HOOK \
            -e KSU_LSM_SECURITY_HOOKS

          grep -q 'CONFIG_LOCALVERSION="-riwutz_josjiz"' arch/arm64/configs/riwutz_josjiz_defconfig
          grep -q 'CONFIG_KSU=y' arch/arm64/configs/riwutz_josjiz_defconfig
          grep -q '# CONFIG_KSU_KPROBES_HOOK is not set' arch/arm64/configs/riwutz_josjiz_defconfig
          grep -q 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' arch/arm64/configs/riwutz_josjiz_defconfig

      - name: Build Watermelon 4.14.355 Image.gz DTB DTBO
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: josjiz
        run: |
          set -euxo pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 riwutz_josjiz_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 Image.gz dtb.img dtbo.img 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img
          test -s out/arch/arm64/boot/dtbo.img
          grep -q -- 'KernelSU-Next version: 12851' "$GITHUB_WORKSPACE/build.log"

          gzip -dc out/arch/arm64/boot/Image.gz > "$GITHUB_WORKSPACE/Image.raw"
          strings "$GITHUB_WORKSPACE/Image.raw" | grep -m1 'Linux version 4.14.355-riwutz_josjiz' | tee "$GITHUB_WORKSPACE/kernel-version.txt"
          sha256sum out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dtbo.img | tee "$GITHUB_WORKSPACE/payload-sha256.txt"

      - name: Package A10 A11 A12 autodetect ZIP
        run: |
          set -euxo pipefail
          git clone --depth=1 -b watermelon https://github.com/xradens/AnyKernel3.git ak3
          rm -rf ak3/.git
          mkdir -p ak3/payload/a10 ak3/payload/a11-a12

          for p in a10 a11-a12; do
            cp kernel/out/arch/arm64/boot/Image.gz "ak3/payload/$p/Image.gz"
            cp kernel/out/arch/arm64/boot/dtb.img "ak3/payload/$p/dtb.img"
            cp kernel/out/arch/arm64/boot/dtbo.img "ak3/payload/$p/dtbo.img"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("ak3/anykernel.sh")
          s = p.read_text()
          s = s.replace(
              "kernel.string=OSS Kernel | POCO X3/NFC",
              "kernel.string=riwutz_josjiz",
          )
          s = re.sub(r"supported\.versions=[^\n]*", "supported.versions=10-12", s)
          anchor = ". tools/ak3-core.sh;\n\n# boot install\n"
          insert = """. tools/ak3-core.sh;

          # Android-version autodetect. A10 and A11/A12 are separate payload
          # slots so the A10 DTB/DTBO can diverge later without changing ZIP logic.
          ANDROID_VER="$(getprop ro.build.version.release 2>/dev/null | cut -d. -f1)"
          case "$ANDROID_VER" in
            10) PAYLOAD="$home/payload/a10" ;;
            11|12) PAYLOAD="$home/payload/a11-a12" ;;
            *) abort "riwutz_josjiz: Android $ANDROID_VER is not supported" ;;
          esac
          ui_print "- riwutz_josjiz / Android $ANDROID_VER"
          cp -f "$PAYLOAD/Image.gz" "$home/Image.gz"
          cp -f "$PAYLOAD/dtb.img" "$home/dtb.img"
          cp -f "$PAYLOAD/dtbo.img" "$home/dtbo.img"

          # boot install
          """
          insert = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in insert.splitlines()
          ) + "\n"
          if anchor not in s:
              raise SystemExit("AnyKernel insertion anchor not found")
          p.write_text(s.replace(anchor, insert, 1))
          PY

          grep -q 'kernel.string=riwutz_josjiz' ak3/anykernel.sh
          grep -q 'supported.versions=10-12' ak3/anykernel.sh
          grep -q 'payload/a10' ak3/anykernel.sh
          grep -q 'payload/a11-a12' ak3/anykernel.sh
          rm -f ak3/Image.gz ak3/dtb.img ak3/dtbo.img
          (cd ak3 && zip -r9 "../$ZIP_NAME" . -x '*.git*' 'README.md')
          unzip -t "$ZIP_NAME"
          sha256sum "$ZIP_NAME" | tee zip-sha256.txt

      - name: Upload riwutz_josjiz build
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz
          path: |
            riwutz_josjiz.zip
            build.log
            kernel-version.txt
            ksunext-version.txt
            wifi-fix.txt
            compiler.txt
            payload-sha256.txt
            zip-sha256.txt
          if-no-files-found: error
