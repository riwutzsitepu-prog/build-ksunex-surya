name: riwutz_josjiz A10 BOOTFIX5 KSU ISOLATION

on:
  push:
    branches:
      - riwutz-a10-bootfix2
    paths:
      - '.github/workflows/riwutz-josjiz-a10-bootfix3-cbl201.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 unzip xz-utils zip

      - name: Checkout exact Watermelon 4.14.355 donor base
        run: |
          rm -rf kernel
          git init kernel
          git -C kernel remote add origin https://github.com/xradens/msm-4.14.git
          git -C kernel fetch --depth=1 origin 95dffb0397b21a8a54fefec47801ab460be5532f
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "95dffb0397b21a8a54fefec47801ab460be5532f"
          grep -q '^SUBLEVEL = 355$' kernel/Makefile
          git -C kernel rev-parse HEAD | tee exact-base.txt

      - name: Add Android 10 boosted_task_util forward declaration
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/sched/fair.c')
          s = p.read_text()
          old = "return max(task_util(p), _task_util_est(p));\n}\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          new = "return max(task_util(p), _task_util_est(p));\n}\n\nstatic inline unsigned long boosted_task_util(struct task_struct *task);\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          if old not in s:
              raise SystemExit('boosted_task_util declaration anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n 'static inline unsigned long boosted_task_util(struct task_struct \*task);' kernel/sched/fair.c

      - name: Prepare ClangBuiltLinux LLVM 20.1.0
        run: |
          rm -rf tc llvm-20.1.0-x86_64.tar.xz
          mkdir -p tc/llvm-20.1.0
          curl -L --fail --retry 3 \
            https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.0-x86_64.tar.xz \
            -o llvm-20.1.0-x86_64.tar.xz
          test "$(stat -c%s llvm-20.1.0-x86_64.tar.xz)" = "129714604"
          sha256sum llvm-20.1.0-x86_64.tar.xz | tee llvm-20.1.0.sha256
          tar -xJf llvm-20.1.0-x86_64.tar.xz -C tc/llvm-20.1.0 --strip-components=1
          tc/llvm-20.1.0/bin/clang --version | tee clang-version.txt
          tc/llvm-20.1.0/bin/clang --version | grep -q 'clang version 20.1.0'
          echo "$GITHUB_WORKSPACE/tc/llvm-20.1.0/bin" >> "$GITHUB_PATH"

      - name: Configure BOOTFIX5A donor-like scheduler KSU OFF
        working-directory: kernel
        run: |
          rm -rf out5a
          make O=out5a LLVM=1 surya_defconfig
          scripts/config --file out5a/.config --disable KSU
          scripts/config --file out5a/.config --disable UCLAMP_TASK
          scripts/config --file out5a/.config --disable UCLAMP_TASK_GROUP
          scripts/config --file out5a/.config --disable UCLAMP_BUCKETS_COUNT
          scripts/config --file out5a/.config --enable SCHED_TUNE
          scripts/config --file out5a/.config --enable FAIR_GROUP_SCHED
          scripts/config --file out5a/.config --set-str LOCALVERSION "-riwutz_josjiz"
          scripts/config --file out5a/.config --disable LOCALVERSION_AUTO
          make O=out5a LLVM=1 olddefconfig
          grep -q '^# CONFIG_KSU is not set$' out5a/.config
          grep -q '^CONFIG_SCHED_TUNE=y$' out5a/.config
          grep -q '^CONFIG_FAIR_GROUP_SCHED=y$' out5a/.config
          ! grep -q '^CONFIG_UCLAMP_TASK=y$' out5a/.config
          ! grep -q '^CONFIG_UCLAMP_TASK_GROUP=y$' out5a/.config
          cp out5a/.config ../bootfix5A.config

      - name: Build BOOTFIX5A Image
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: cahazzu
        run: |
          set -o pipefail
          make O=out5a -j"$(nproc)" LLVM=1 Image.gz 2>&1 | tee ../bootfix5A-build.log
          test -s out5a/arch/arm64/boot/Image.gz
          cp out5a/arch/arm64/boot/Image.gz ../Image-BOOTFIX5A.gz
          gzip -dc out5a/arch/arm64/boot/Image.gz > ../Image-BOOTFIX5A.raw
          strings ../Image-BOOTFIX5A.raw | grep -F 'Linux version 4.14.355-riwutz_josjiz' | head -n1 | tee ../bootfix5A-version.txt
          ! strings ../Image-BOOTFIX5A.raw | grep -q 'KernelSU:'
          rm -f ../Image-BOOTFIX5A.raw
          sha256sum ../Image-BOOTFIX5A.gz | tee ../Image-BOOTFIX5A.gz.sha256

      - name: Configure BOOTFIX5B donor-like scheduler KSU ON
        working-directory: kernel
        run: |
          rm -rf out5b
          make O=out5b LLVM=1 surya_defconfig
          scripts/config --file out5b/.config --enable KSU
          scripts/config --file out5b/.config --disable UCLAMP_TASK
          scripts/config --file out5b/.config --disable UCLAMP_TASK_GROUP
          scripts/config --file out5b/.config --disable UCLAMP_BUCKETS_COUNT
          scripts/config --file out5b/.config --enable SCHED_TUNE
          scripts/config --file out5b/.config --enable FAIR_GROUP_SCHED
          scripts/config --file out5b/.config --set-str LOCALVERSION "-riwutz_josjiz"
          scripts/config --file out5b/.config --disable LOCALVERSION_AUTO
          make O=out5b LLVM=1 olddefconfig
          grep -q '^CONFIG_KSU=y$' out5b/.config
          grep -q '^CONFIG_SCHED_TUNE=y$' out5b/.config
          grep -q '^CONFIG_FAIR_GROUP_SCHED=y$' out5b/.config
          ! grep -q '^CONFIG_UCLAMP_TASK=y$' out5b/.config
          ! grep -q '^CONFIG_UCLAMP_TASK_GROUP=y$' out5b/.config
          cp out5b/.config ../bootfix5B.config

      - name: Build BOOTFIX5B Image
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: cahazzu
        run: |
          set -o pipefail
          make O=out5b -j"$(nproc)" LLVM=1 Image.gz 2>&1 | tee ../bootfix5B-build.log
          test -s out5b/arch/arm64/boot/Image.gz
          cp out5b/arch/arm64/boot/Image.gz ../Image-BOOTFIX5B.gz
          gzip -dc out5b/arch/arm64/boot/Image.gz > ../Image-BOOTFIX5B.raw
          strings ../Image-BOOTFIX5B.raw | grep -F 'Linux version 4.14.355-riwutz_josjiz' | head -n1 | tee ../bootfix5B-version.txt
          strings ../Image-BOOTFIX5B.raw | grep -m3 -E 'KernelSU|KSU_VERSION' > ../bootfix5B-ksu-strings.txt || true
          rm -f ../Image-BOOTFIX5B.raw
          sha256sum ../Image-BOOTFIX5B.gz | tee ../Image-BOOTFIX5B.gz.sha256

      - name: Upload BOOTFIX5 images and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz-BOOTFIX5-A10
          if-no-files-found: warn
          retention-days: 30
          path: |
            Image-BOOTFIX5A.gz
            Image-BOOTFIX5A.gz.sha256
            Image-BOOTFIX5B.gz
            Image-BOOTFIX5B.gz.sha256
            bootfix5A.config
            bootfix5B.config
            bootfix5A-build.log
            bootfix5B-build.log
            bootfix5A-version.txt
            bootfix5B-version.txt
            bootfix5B-ksu-strings.txt
            exact-base.txt
            clang-version.txt
            llvm-20.1.0.sha256
