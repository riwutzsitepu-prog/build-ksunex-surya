name: riwutz_josjiz A10 BOOTFIX6 REFCONFIG 4.14.355

on:
  push:
    branches:
      - riwutz-a10-bootfix2
    paths:
      - '.github/workflows/riwutz-josjiz-a10-bootfix3-cbl201.yml'
      - '.github/configs/wih-riwut-a10-delta.config.gz.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 unzip xz-utils zip

      - name: Checkout exact Watermelon 4.14.355 donor base
        run: |
          rm -rf kernel
          git init kernel
          git -C kernel remote add origin https://github.com/xradens/msm-4.14.git
          git -C kernel fetch --depth=1 origin 95dffb0397b21a8a54fefec47801ab460be5532f
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "95dffb0397b21a8a54fefec47801ab460be5532f"
          grep -q '^SUBLEVEL = 355$' kernel/Makefile
          git -C kernel rev-parse HEAD | tee exact-base.txt

      - name: Add Android 10 boosted_task_util forward declaration
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/sched/fair.c')
          s = p.read_text()
          old = "return max(task_util(p), _task_util_est(p));\n}\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          new = "return max(task_util(p), _task_util_est(p));\n}\n\nstatic inline unsigned long boosted_task_util(struct task_struct *task);\n\n#ifdef CONFIG_UCLAMP_TASK\n"
          if old not in s:
              raise SystemExit('boosted_task_util declaration anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n 'static inline unsigned long boosted_task_util(struct task_struct \*task);' kernel/sched/fair.c

      - name: Prepare ClangBuiltLinux LLVM 20.1.0
        run: |
          rm -rf tc llvm-20.1.0-x86_64.tar.xz
          mkdir -p tc/llvm-20.1.0
          curl -L --fail --retry 3 \
            https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.0-x86_64.tar.xz \
            -o llvm-20.1.0-x86_64.tar.xz
          test "$(stat -c%s llvm-20.1.0-x86_64.tar.xz)" = "129714604"
          sha256sum llvm-20.1.0-x86_64.tar.xz | tee llvm-20.1.0.sha256
          tar -xJf llvm-20.1.0-x86_64.tar.xz -C tc/llvm-20.1.0 --strip-components=1
          tc/llvm-20.1.0/bin/clang --version | tee clang-version.txt
          tc/llvm-20.1.0/bin/clang --version | grep -q 'clang version 20.1.0'
          echo "$GITHUB_WORKSPACE/tc/llvm-20.1.0/bin" >> "$GITHUB_PATH"

      - name: Configure 4.14.355 from known-good A10 config delta
        working-directory: kernel
        run: |
          rm -rf out6
          make O=out6 LLVM=1 surya_defconfig

          set +e
          base64 -d "$GITHUB_WORKSPACE/.github/configs/wih-riwut-a10-delta.config.gz.b64" | gzip -dc > ../wih-riwut-a10-delta.config
          gzip_rc=$?
          set -e
          test -s ../wih-riwut-a10-delta.config
          echo '1692159dfb98bb4889e5bd9e2ffb07ee604936eeb30f37420e4cda4286d25105  ../wih-riwut-a10-delta.config' | sha256sum -c -
          if [ "$gzip_rc" -ne 0 ]; then
            echo 'gzip footer CRC mismatch ignored: extracted A10 delta SHA256 is exact'
          fi

          python3 - <<'PY'
          from pathlib import Path

          cfg_path = Path('out6/.config')
          delta_path = Path('../wih-riwut-a10-delta.config')
          lines = cfg_path.read_text().splitlines()
          pos = {}
          for i, line in enumerate(lines):
              if line.startswith('CONFIG_') and '=' in line:
                  pos[line.split('=', 1)[0]] = i
              elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                  pos[line.split()[1]] = i

          applied = []
          for line in delta_path.read_text().splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.startswith('CONFIG_') and '=' in line:
                  key = line.split('=', 1)[0]
              elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                  key = line.split()[1]
              else:
                  continue
              if key in pos:
                  lines[pos[key]] = line
              else:
                  pos[key] = len(lines)
                  lines.append(line)
              applied.append(line)

          cfg_path.write_text('\n'.join(lines) + '\n')
          Path('../delta-applied-before-olddefconfig.txt').write_text('\n'.join(applied) + '\n')
          print('delta lines applied:', len(applied))
          PY

          # Diagnostic boot baseline: keep KernelSU disabled until 4.14.355 itself boots.
          scripts/config --file out6/.config --disable KSU
          scripts/config --file out6/.config --set-str LOCALVERSION "-riwutz_josjiz"
          scripts/config --file out6/.config --disable LOCALVERSION_AUTO
          make O=out6 LLVM=1 olddefconfig

          cp out6/.config ../bootfix6.config

          python3 - <<'PY'
          from pathlib import Path
          def parse(lines):
              d={}
              for line in lines:
                  if line.startswith('CONFIG_') and '=' in line:
                      d[line.split('=',1)[0]]=line
                  elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                      d[line.split()[1]]=line
              return d
          req=parse(Path('../wih-riwut-a10-delta.config').read_text().splitlines())
          fin=parse(Path('out6/.config').read_text().splitlines())
          rejected=[]
          for k,v in sorted(req.items()):
              if fin.get(k) != v:
                  rejected.append(f'{k}\n  requested: {v}\n  final:     {fin.get(k, "<absent>")}')
          Path('../delta-rejected-after-olddefconfig.txt').write_text('\n'.join(rejected)+'\n')
          print('delta mismatches after olddefconfig:', len(rejected))
          PY

          {
            grep -E '^(CONFIG_(MEMCG|MODULES|SCHED_WALT|SCHED_CORE_CTL|SCHED_TUNE|FAIR_GROUP_SCHED|PSTORE|PCI_MSM|MSM_GCC_SM6150|MSM_DISPCC_SM6150|MSM_GPUCC_SM6150|PINCTRL_SM6150|SCSI_UFS_QCOM_ICE|MMC_SDHCI_MSM_ICE|BUILD_ARM64_APPENDED_DTB_IMAGE|IMG_GZ_DTB)=|# CONFIG_(KSU|UCLAMP_TASK|UCLAMP_TASK_GROUP) is not set)' out6/.config || true
          } | tee ../bootfix6-key-config.txt

          grep -q '^# CONFIG_KSU is not set$' out6/.config
          grep -q '^CONFIG_LOCALVERSION="-riwutz_josjiz"$' out6/.config

      - name: Build BOOTFIX6 4.14.355 Image
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: riwutz
          KBUILD_BUILD_HOST: cahazzu
        run: |
          set -o pipefail
          make O=out6 -j"$(nproc)" LLVM=1 Image.gz 2>&1 | tee ../bootfix6-build.log
          test -s out6/arch/arm64/boot/Image.gz
          cp out6/arch/arm64/boot/Image.gz ../Image-BOOTFIX6.gz
          gzip -dc out6/arch/arm64/boot/Image.gz > ../Image-BOOTFIX6.raw
          strings ../Image-BOOTFIX6.raw | grep -F 'Linux version 4.14.355-riwutz_josjiz' | head -n1 | tee ../bootfix6-version.txt
          ! strings ../Image-BOOTFIX6.raw | grep -q 'KernelSU:'
          rm -f ../Image-BOOTFIX6.raw
          sha256sum ../Image-BOOTFIX6.gz | tee ../Image-BOOTFIX6.gz.sha256

      - name: Upload BOOTFIX6 image and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riwutz_josjiz-BOOTFIX6-A10-REFCONFIG
          if-no-files-found: warn
          retention-days: 30
          path: |
            Image-BOOTFIX6.gz
            Image-BOOTFIX6.gz.sha256
            bootfix6.config
            bootfix6-build.log
            bootfix6-version.txt
            bootfix6-key-config.txt
            wih-riwut-a10-delta.config
            delta-applied-before-olddefconfig.txt
            delta-rejected-after-olddefconfig.txt
            exact-base.txt
            clang-version.txt
            llvm-20.1.0.sha256
