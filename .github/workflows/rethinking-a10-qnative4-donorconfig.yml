          echo "$DONOR_DTB_SHA256  $TAIL" | sha256sum -c -

          python3 donor_payload/verify_test4_donor.py "$TAIL"             --out-dir exact_dtb/fdts             --report exact_dtb/FDT_VALIDATION.txt
          grep -q '^FDT_VALIDATION=PASS$' exact_dtb/FDT_VALIDATION.txt
          grep -q '^FDT_COUNT=12$' exact_dtb/FDT_VALIDATION.txt
          grep -q '^FDT_LEFTOVER_BYTES=0$' exact_dtb/FDT_VALIDATION.txt
          cp exact_dtb/FDT_VALIDATION.txt "$GITHUB_WORKSPACE/FDT_VALIDATION.txt"

