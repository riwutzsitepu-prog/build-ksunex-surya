          name: rethinking-a10-qnative4-donorconfig-exactdtb
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            kernel-version.txt
            assembled-kernel-version.txt
            compiled-hashes.txt
            FDT_VALIDATION.txt
