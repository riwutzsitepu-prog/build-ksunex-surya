name: CahAzzu Surya Android 10-11 KSU Next 1.1.1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cahazzu-surya-a10-a11-ksunext111.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a10
            source_sha: fa1df47eb127d03f531917f2b47d6c703361d703
            image_name: Image.gz-dtb

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio device-tree-compiler flex git libssl-dev \
            python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch clean surya source
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin https://github.com/mahajant99/kernel_xiaomi_surya.git
          git fetch --depth=1 origin "${{ matrix.source_sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ matrix.source_sha }}"

      - name: Fetch Android GCC 4.9 toolchains
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc" --version | head -n 1
          "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc" --version | head -n 1

      - name: Integrate KernelSU Next v1.1.1
        working-directory: kernel
        run: |
          set -euxo pipefail
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.1.1/kernel/setup.sh | bash -s v1.1.1
          test -f KernelSU-Next/kernel/Kconfig
          git -C KernelSU-Next describe --tags --exact-match | grep -Fx v1.1.1

      - name: Patch A10 legacy source compile blocker
        working-directory: kernel
        run: |
          set -euxo pipefail
          # This source has a literal malformed '#elif' with no expression.
          sed -i '/^#elif$/c\#else' kernel/taskstats.c
          test "$(grep -c '^#elif$' kernel/taskstats.c)" -eq 0

          # First actual A10 compile error: type-correct TAS256x format strings.
          sed -i 's/max profile = %d\\n/max profile = %ld\\n/' techpack/audio/asoc/codecs/tas256x/tas256x-codec.c
          sed -i 's/File size not match, %d %zu/File size not match, %zu %u/' techpack/audio/asoc/codecs/tas256x/tas256x-codec.c
          grep -n 'max profile = %ld' techpack/audio/asoc/codecs/tas256x/tas256x-codec.c
          grep -n 'File size not match, %zu %u' techpack/audio/asoc/codecs/tas256x/tas256x-codec.c

          # Next actual A10 compile error: C local consts are not valid case labels.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/gpu/drm/msm/sde_hdcp_2x.c')
          s = p.read_text()
          old = '\tu8 const hdcp_min_enc_level_0 = 0, hdcp_min_enc_level_1 = 1,\n\t   hdcp_min_enc_level_2 = 2;'
          new = '\tenum { hdcp_min_enc_level_0 = 0, hdcp_min_enc_level_1 = 1,\n\t   hdcp_min_enc_level_2 = 2 };'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A2 'enum { hdcp_min_enc_level_0' drivers/gpu/drm/msm/sde_hdcp_2x.c

          # Next actual A10 compile error: bounded IPA buffer trips old copy-size checker.
          sed -i 's/missing = copy_from_user(dbg_buff, buf, count);/missing = _copy_from_user(dbg_buff, buf, count);/' drivers/platform/msm/ipa/ipa_v3/ipa.c
          grep -n '_copy_from_user(dbg_buff, buf, count)' drivers/platform/msm/ipa/ipa_v3/ipa.c
          grep -n -A2 -B2 '#else' kernel/taskstats.c | tail -n 10

      - name: Configure CahAzzu
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: CahAzzu
          KBUILD_BUILD_HOST: CahAzzu
        run: |
          set -euxo pipefail
          COMMON=(
            O=out ARCH=arm64
            CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
            DTC_EXT=/usr/bin/dtc
          )
          make "${COMMON[@]}" surya_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION "-CahAzzu"
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e MODULES
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KSU_KPROBES_HOOK
          scripts/config --file out/.config -d KSU_DEBUG
          scripts/config --file out/.config -e OVERLAY_FS
          if [ "${{ matrix.variant }}" = "a10" ]; then
            scripts/config --file out/.config -d CC_STACKPROTECTOR_REGULAR
            scripts/config --file out/.config -e CC_STACKPROTECTOR_STRONG
            scripts/config --file out/.config -d FORTIFY_SOURCE
          fi
          make "${COMMON[@]}" olddefconfig

          grep -Fx 'CONFIG_KSU=y' out/.config
          grep -Fx 'CONFIG_MODULES=y' out/.config
          grep -Fx 'CONFIG_KPROBES=y' out/.config
          grep -Fx 'CONFIG_KSU_KPROBES_HOOK=y' out/.config
          grep -Fx 'CONFIG_LOCALVERSION="-CahAzzu"' out/.config
          grep -Fx '# CONFIG_LOCALVERSION_AUTO is not set' out/.config
          if [ "${{ matrix.variant }}" = "a10" ]; then
            grep -Fx 'CONFIG_CC_STACKPROTECTOR_STRONG=y' out/.config
            grep -Fx '# CONFIG_CC_STACKPROTECTOR_REGULAR is not set' out/.config
            grep -Fx '# CONFIG_FORTIFY_SOURCE is not set' out/.config
          fi

      - name: Build CahAzzu
        working-directory: kernel
        env:
          KBUILD_BUILD_USER: CahAzzu
          KBUILD_BUILD_HOST: CahAzzu
        run: |
          set -o pipefail
          COMMON=(
            O=out ARCH=arm64
            CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
            CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
            DTC_EXT=/usr/bin/dtc
          )
          make "${COMMON[@]}" -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.variant }}.log"
          test -s "out/arch/arm64/boot/${{ matrix.image_name }}"
          echo "Kernel release: $(cat out/include/config/kernel.release)"
          ls -lh "out/arch/arm64/boot/${{ matrix.image_name }}"

      - name: Stage kernel payload
        if: success()
        working-directory: kernel
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp "out/arch/arm64/boot/${{ matrix.image_name }}" "$GITHUB_WORKSPACE/stage/"
          cp out/include/config/kernel.release "$GITHUB_WORKSPACE/stage/kernel.release"
          cp out/.config "$GITHUB_WORKSPACE/stage/config"
          sha256sum "$GITHUB_WORKSPACE/stage/${{ matrix.image_name }}" > "$GITHUB_WORKSPACE/stage/SHA256SUMS"

      - name: Upload build payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-${{ matrix.variant }}
          path: stage/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu-${{ matrix.variant }}-failure
          path: build-${{ matrix.variant }}.log
          if-no-files-found: ignore

  package:
    name: Package CahAzzu.zip
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download A10 payload
        uses: actions/download-artifact@v4
        with:
          name: CahAzzu-a10
          path: payload/a10

      - name: Download successful A11 payload from Run #2
        uses: actions/download-artifact@v4
        with:
          name: CahAzzu-a11
          path: payload/a11
          repository: riwutzsitepu-prog/build-ksunex-surya
          run-id: 35862783280
          github-token: ${{ github.token }}

      - name: Prepare AnyKernel3 for surya
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/rigaz29/surya-kernel-build.git packbase
          mkdir -p CahAzzu/variants/a10 CahAzzu/variants/a11
          cp -a packbase/anykernel/. CahAzzu/
          cp payload/a10/Image.gz-dtb CahAzzu/variants/a10/Image.gz-dtb
          cp payload/a11/Image.gz CahAzzu/variants/a11/Image.gz

          cat > CahAzzu/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## CahAzzu universal Android 10/11 package for Poco X3 NFC (surya)

          properties() { '
          kernel.string=CahAzzu
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=10,11
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # Mount likely Android dynamic/system-as-root paths read-only if recovery has not.
          mount /system 2>/dev/null || true
          mount /system_root 2>/dev/null || true
          mount /vendor 2>/dev/null || true

          sdk="";
          for p in \
            /system/build.prop \
            /system/system/build.prop \
            /system_root/system/build.prop \
            /system_root/system/system/build.prop; do
            if [ -f "$p" ]; then
              sdk=$(grep -m1 '^ro.build.version.sdk=' "$p" | cut -d= -f2 | tr -d '\r')
              [ -n "$sdk" ] && break
            fi
          done

          ui_print "- CahAzzu";
          ui_print "- Detected Android SDK: ${sdk:-unknown}";

          rm -f Image Image.gz Image.gz-dtb Image.lz4 zImage zImage-dtb

          case "$sdk" in
            29)
              ui_print "- Android 10 detected";
              cp variants/a10/Image.gz-dtb Image.gz-dtb || abort "A10 payload missing";
              ;;
            30)
              ui_print "- Android 11 detected";
              cp variants/a11/Image.gz Image.gz || abort "A11 payload missing";
              ;;
            *)
              abort "CahAzzu supports Android 10/11 only (SDK 29/30).";
              ;;
          esac

          dump_boot;
          write_boot;
          EOF

          sed -i 's/^[[:space:]]\{10\}//' CahAzzu/anykernel.sh
          chmod 755 CahAzzu/anykernel.sh

      - name: Validate and zip
        run: |
          set -euxo pipefail
          grep -q 'kernel.string=CahAzzu' CahAzzu/anykernel.sh
          test -s CahAzzu/variants/a10/Image.gz-dtb
          test -s CahAzzu/variants/a11/Image.gz
          (
            cd CahAzzu
            zip -r9 ../CahAzzu.zip . -x '.git*' >/dev/null
          )
          test -s CahAzzu.zip
          sha256sum CahAzzu.zip | tee CahAzzu.zip.sha256
          unzip -l CahAzzu.zip | grep -E 'anykernel.sh|variants/a10/Image.gz-dtb|variants/a11/Image.gz'

      - name: Upload final CahAzzu
        uses: actions/upload-artifact@v4
        with:
          name: CahAzzu
          path: |
            CahAzzu.zip
            CahAzzu.zip.sha256
          if-no-files-found: error
